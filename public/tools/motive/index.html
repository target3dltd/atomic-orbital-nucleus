<script>
/* ===== Motive Upgrade Planner — analysis engine (pure functions) ===== */
const ENGINE = (() => {
  // Motive 3 releases with the licence-maintenance date each needs (≈ release date).
  // approx:true = date not published by NaturalPoint; inferred from announcements.
  const RELEASES = [
    { v: "3.0.0", d: "2022-05-09" }, { v: "3.0.1", d: "2022-06-07" },
    { v: "3.0.2", d: "2023-01-30" }, { v: "3.0.3", d: "2023-03-27" },
    { v: "3.1.0", d: "2024-03-21" }, { v: "3.1.1", d: "2024-05-29" },
    { v: "3.1.2", d: "2024-08-20" }, { v: "3.1.3", d: "2024-09-16" },
    { v: "3.1.4", d: "2024-11-07" }, { v: "3.2.0", d: "2025-04-09" },
    { v: "3.3.0", d: "2025-05-15" }, { v: "3.3.1", d: "2025-06-05" },
    { v: "3.3.2", d: "2025-07-01" }, { v: "3.3.3", d: "2025-07-15" },
    { v: "3.3.4", d: "2025-07-18" }, { v: "3.4.0", d: "2025-11-20" },
    { v: "3.4.1", d: "2026-02-12" }, { v: "3.5.0", d: "2026-07-21", approx: true },
    { v: "3.5.1", d: "2026-09-01", approx: true },
  ];
  const LATEST = RELEASES[RELEASES.length - 1].v;
  const M2_LATEST = { v: "2.3.7", d: "2023-12-07" };

  // USD list prices from optitrack.com/software/motive/pricing (perpetual incl. 1 yr updates; renewal per year)
  const PRICES = {
    "Tracker": { list: 999, renew: 499 },
    "Body": { list: 4999, renew: 2499 },
    "Body Unlimited": { list: 9999, renew: 4999 },
    "Edit": { list: 2499, renew: 1249 },
    "Edit Unlimited": { list: 4999, renew: 2499 },
  };

  // Hardware rules. min = lowest Motive 3 version that supports it.
  // usb = USB device (not supported in Motive 3.0.x). m2 = also runs in Motive 2.x.
  const HW_RULES = [
    { id: "activeio", re: /ActiveIO/i, label: "ActiveIO", kind: "Active", min: "3.5.0", m2: false, note: "ActiveIO needs Motive 3.5 or later." },
    { id: "x260", re: /(Prime\s*X|Slim\s*X)\s*260/i, label: "PrimeX / SlimX 260", kind: "Camera", min: "3.5.0", m2: false, note: "Supported from Motive 3.5.0." },
    { id: "slimx22", re: /Slim\s*X\s*22/i, label: "SlimX 22", kind: "Camera", min: "3.5.0", m2: false, note: "Supported from Motive 3.5.0. Site report: 3.4 Final does not recognise the latest camera firmware." },
    { id: "versax", re: /Versa\s*X/i, label: "VersaX", kind: "Camera", min: "3.2.0", m2: false, note: "Supported from Motive 3.2.0." },
    { id: "x120", re: /(Prime\s*X|Slim\s*X)\s*120/i, label: "PrimeX / SlimX 120", kind: "Camera", min: "3.1.0", m2: false, note: "Full support from Motive 3.1.0." },
    { id: "x22_41", re: /Prime\s*X\s*(22|41)W?/i, label: "PrimeX 22 / 41", kind: "Camera", min: "3.0.0", m2: true, serialMin: { from: 99450, min: "3.0.3" }, note: "Units with serial M99450 and higher need Motive 3.0.3 or later." },
    { id: "x13", re: /(Prime\s*X|Slim\s*X)\s*13W?/i, label: "PrimeX 13 / 13W / SlimX 13", kind: "Camera", min: "3.0.0", m2: true, note: "Duplex mode support from 3.3.3." },
    { id: "color", re: /Prime\s*Colou?r/i, label: "Prime Color", kind: "Camera", min: "3.0.0", m2: true, verify: true, note: "Reference video camera. Confirm firmware/Motive pairing with NaturalPoint." },
    { id: "legacyPrime", re: /\bPrime\s*(13W?|17W|41)\b/i, label: "Prime (legacy, non-X)", kind: "Camera", min: "3.0.0", m2: true, verify: true, note: "End-of-sale Prime series. Confirm Motive 3.5 support with NaturalPoint before quoting." },
    { id: "usbcam", re: /Flex\s*(13|3)\b|Slim\s*3U|SL-V120|TRIO\s*3|TRIO3|DUO\s*3|V120/i, label: "USB camera (Flex / Slim 3U / Duo / Trio)", kind: "Camera", min: "3.1.0", m2: true, usb: true, note: "Not supported in Motive 3.0.x; restored in 3.1.0." },
    { id: "legacyUsb", re: /Flex\s*V100|V100|S250e|Slim\s*13E/i, label: "Legacy camera", kind: "Camera", min: null, m2: true, verify: true, note: "Very old model. Not listed in current Motive 3 docs: treat as unsupported until NaturalPoint confirms." },
    { id: "optihub", re: /OptiHub\s*2/i, label: "OptiHub 2", kind: "Hub", min: "3.1.0", m2: true, usb: true, note: "USB sync hub for Flex cameras. Same 3.0.x gap as USB cameras." },
    { id: "esync", re: /eSync\s*2/i, label: "eSync 2", kind: "Sync", min: "3.0.0", m2: true, note: "" },
    { id: "activeClassic", re: /Active\s*(Base\s*Station|BaseStation|Tag|Puck)/i, label: "Active (classic)", kind: "Active", min: "3.0.0", m2: true, note: "Classic active hardware. ActiveIO is the 3.5 successor." },
    { id: "seckeyM", re: /SECKEY-M|Security\s*Key\s*M\b/i, label: "Security Key M", kind: "Key", min: "3.0.0", m2: true, keyNo30: true, verify: true, note: "Docs: works with any version except 3.0.x. Changelog lists support added in 3.5.0, so check before installing an older build." },
    { id: "seckey", re: /SECKEY|Security\s*Key/i, label: "Security Key", kind: "Key", min: "3.0.0", m2: false, note: "Motive 3.x only. Cannot run a Motive 2 licence." },
    { id: "hdwkey", re: /HDWKEY|Hardware\s*Key/i, label: "Hardware Key", kind: "Key", min: "3.0.0", m2: true, keyNo30: true, note: "Works with all versions except 3.0.x." },
  ];

  const DAY = 86400000;
  const pad = (n) => String(n).padStart(2, "0");
  const iso = (d) => d ? `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}` : "";
  const fmt = (d) => d ? d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" }) : "—";
  function parseDate(s) {
    if (!s) return null;
    s = String(s).trim();
    let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) return new Date(Date.UTC(+m[3], +m[2] - 1, +m[1]));
    m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
    return null;
  }
  const addYears = (d, n) => new Date(Date.UTC(d.getUTCFullYear() + n, d.getUTCMonth(), d.getUTCDate()));
  const vcmp = (a, b) => { const x = a.split(".").map(Number), y = b.split(".").map(Number); for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) - (y[i] || 0); } return 0; };
  const vmax = (a, b) => (!a ? b : !b ? a : vcmp(a, b) >= 0 ? a : b);

  function maxRunnable(major, end) {
    if (!end) return null;
    if (major === 2) return end >= parseDate(M2_LATEST.d) ? M2_LATEST.v : "2.x (pre-" + fmt(end) + ")";
    let best = null;
    for (const r of RELEASES) if (parseDate(r.d) <= end) best = r.v;
    return best; // null = predates 3.0.0 final
  }

  // ---------- CSV ----------
  function parseCSV(text) {
    const rows = []; let row = [], field = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
        else field += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field); rows.push(row); row = []; field = "";
      } else field += c;
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    const head = (rows.shift() || []).map((h) => h.trim());
    return rows.filter((r) => r.some((c) => c.trim())).map((r, i) => {
      const o = { _row: i + 2 }; head.forEach((h, j) => (o[h] = (r[j] || "").trim())); return o;
    });
  }

  // ---------- Normalisers ----------
  const slug = (s) => String(s || "").toLowerCase().normalize("NFKD").replace(/[^\w]+/g, "-").replace(/^-|-$/g, "").slice(0, 80) || "unknown";
  const STOP = new Set(["the", "of", "and", "ltd", "limited", "plc", "inc", "llc", "uk", "a", "for", "at", "in", "school", "department", "dept", "-", "license", "licence", "deal"]);
  const SYN = { uni: "university", univ: "university", met: "metropolitan", b: "burton" };
  function tokens(s) { return new Set(String(s || "").toLowerCase().replace(/\([^)]*\)/g, " ").replace(/&/g, " and ").replace(/[^a-z0-9 ]+/g, " ").split(/\s+/).map((t) => SYN[t] || t).map((t) => (t.length > 4 && /[^s]s$/.test(t) ? t.slice(0, -1) : t)).filter((t) => t && !STOP.has(t))); }
  function nameScore(a, b) {
    const A = tokens(a), B = tokens(b); if (!A.size || !B.size) return 0;
    let inter = 0; A.forEach((t) => B.has(t) && inter++);
    return inter / Math.min(A.size, B.size);
  }

  function editionOf(product, serial) {
    const p = product || "";
    let ed = null;
    if (/Body[\s-]*Unlimited/i.test(p)) ed = "Body Unlimited";
    else if (/Edit[\s-]*Unlimited/i.test(p)) ed = "Edit Unlimited";
    else if (/Body/i.test(p)) ed = "Body";
    else if (/Edit/i.test(p)) ed = "Edit";
    else if (/Tracker|core/i.test(p)) ed = "Tracker";
    let major = null; const m = p.match(/(?:Tracker|Body|Unlimited|Edit)\s*(\d)/i);
    if (m) major = +m[1];
    const s = (serial || "").toUpperCase();
    if (!major) { if (/^MV/.test(s)) major = 2; else if (/^M(TR|BD|UL|EU|ED)/.test(s)) major = 3; }
    if (!ed) { if (/^M(VC|TR)/.test(s)) ed = "Tracker"; else if (/^M(VU|UL)/.test(s)) ed = "Body Unlimited"; else if (/^M(VA|BD)/.test(s)) ed = "Body"; else if (/^ME/.test(s)) ed = "Edit Unlimited"; }
    return { edition: ed || "Unknown", major: major || 3 };
  }

  function hwRule(product) { for (const r of HW_RULES) if (r.re.test(product || "")) return r; return null; }
  function hwMin(rule, serial) {
    if (!rule) return null;
    let min = rule.min;
    if (rule.serialMin) { const n = parseInt(String(serial || "").replace(/\D/g, ""), 10); if (n >= rule.serialMin.from) min = vmax(min, rule.serialMin.min); }
    return min;
  }

  const INTERNAL_RE = /^(target3d|stock\b|markers\b|inhouse|in-house)/i;
  function isNoteRow(r) {
    const others = Object.keys(r).filter((k) => k !== "Client" && k !== "_row" && k !== "Notes").some((k) => (r[k] || "").trim());
    return !others && (r["Client"] || "").length > 40;
  }
  const ymDate = (ym) => { const [y, m] = ym.split("-").map(Number); return new Date(Date.UTC(y, m - 1, 15)); };
  const fmtYm = (ym) => ymDate(ym).toLocaleDateString("en-GB", { month: "short", year: "numeric", timeZone: "UTC" });
  // QuickBooks item code -> edition / major / licence-or-maintenance
  function qboCode(code, ym) {
    const after3 = ym >= "2022-05", late = ym >= "2023-01";
    const T = { TR: "Tracker", BD: "Body", BU: "Body Unlimited", ED: "Edit" };
    let m;
    if (code === "SYS2") return { edition: "Body", major: 2, kind: "lic", label: "System bundle incl. Motive licence" };
    if (code === "TRIO") return { edition: "Tracker", major: after3 ? 3 : 2, kind: "lic", label: "Duo/Trio bundle incl. Motive:Tracker" };
    if (code === "UPG3") return { edition: "Body", major: 3, kind: "lic", label: "Upgrade to Motive 3" };
    if (code === "ED-MNT") return { edition: "Edit", major: 3, kind: "mnt", label: "Motive:Edit maintenance" };
    if ((m = code.match(/^(TR|BD)-MNT$/))) return { edition: T[m[1]], major: null, ambiguous: true, kind: "mnt", label: `Motive:${T[m[1]]} maintenance` };
    if ((m = code.match(/^(TR|BD|BU|ED)([23])(-MNT|\+M)$/))) return { edition: T[m[1]], major: +m[2], ambiguous: m[2] === "2" && late, kind: "mnt", label: `Motive:${T[m[1]]} ${m[2]} maintenance` };
    if ((m = code.match(/^(TR|BD|BU|ED)([23])$/))) return { edition: T[m[1]], major: +m[2], ambiguous: m[2] === "2" && late, kind: "lic", label: `Motive:${T[m[1]]} ${m[2]} licence` };
    return null;
  }
  const GAP_TYPES = /slip in email|no packing slip/i;

  // ---------- Build clients ----------
  let GF = [], GSER = new Map();
  // licence serial key tolerant of sheet typos (MVA4346 = MVAL4346)
  const serKey = (x) => { const m = String(x || "").toUpperCase().match(/^(M[A-Z]{2})[A-Z]?(\d{3,5})$/); return m ? m[1] + m[2] : String(x || "").toUpperCase(); };
  const isMotiveSerial = (x) => /^M(V|T|B|E|U)[A-Z]{1,3}\d{3,5}$/i.test(x || "");
  const isUpdateSerial = (x) => /^M[A-Z]{2}U\d{3,5}$/i.test(x || "");
  const SRC = { gmail: "Gmail", drive: "Drive", ship: "NaturalPoint shipments" };
  function analyse(rows, opts) {
    GF = (opts && opts.gapfill) || [];
    GSER = new Map();
    // which client each known licence serial already belongs to (filled in once client names are settled below)
    const gserRaw = [];
    for (const r of rows) { const sn = r["Serial number"]; if (sn && isMotiveSerial(sn)) gserRaw.push([sn, (r["Client"] || "").trim()]); }
    if (opts && opts.qbo) for (const [cust, ls] of Object.entries(opts.qbo.customers || {})) for (const l of ls) for (const sn of String(l[5] || "").split(/[ ,;]+/)) if (isMotiveSerial(sn)) gserRaw.push([sn, l[4] || cust]);
    const today = opts.today || new Date(Date.UTC(new Date().getUTCFullYear(), new Date().getUTCMonth(), new Date().getUTCDate()));
    const soon = new Date(today.getTime() + 90 * DAY);
    const excludeRe = opts.excludeInternal === false ? null : INTERNAL_RE;
    // ---- client names: unattributed rows aside, then fold spelling variants of one organisation together ----
    const possibles = new Map(); // suggested client -> rows marked "UNKNOWN – possibly X (QB inv N)"
    const cnt = new Map();
    for (const r of rows) {
      const name = (r["Client"] || "").trim(); if (!name || isNoteRow(r)) continue;
      const pm = name.match(/^UNKNOWN\s*[–-]\s*possibly\s+(.+?)\s*\(QB inv\s*(\d+)\)\s*$/i);
      if (pm) { const k = pm[1].replace(/\s+/g, " ").trim(); if (!possibles.has(k)) possibles.set(k, []); possibles.get(k).push({ ...r, _inv: pm[2] }); continue; }
      cnt.set(name, (cnt.get(name) || 0) + 1);
    }
    const aliasOf = new Map(); // QuickBooks customer -> end client used on invoices (e.g. Trigger OpCo3 -> Clays)
    if (opts.qbo) for (const [cust, ls] of Object.entries(opts.qbo.customers || {})) { const a = ls.find((l) => l[4]); if (a && ls.every((l) => !l[4] || l[4] === a[4])) aliasOf.set(normName(cust), a[4]); }
    const known = new Set(((opts.qbo && opts.qbo.knownClients) || []).map((x) => x.trim().toLowerCase()));
    const isKnown = (n) => known.has(n.trim().toLowerCase());
    const canonical = new Map();
    const names = [...cnt.keys()].sort((a, b) => (isKnown(b) - isKnown(a)) || cnt.get(b) - cnt.get(a));
    const seen = [];
    for (const n0 of names) {
      let n = aliasOf.get(normName(n0)) || n0;
      const hit = seen.find((m) => sameName(m, n));
      canonical.set(n0, hit || n); if (!hit) seen.push(n);
    }
    for (const [sn, n] of gserRaw) { if (!n || /^UNKNOWN\b/i.test(n) || INTERNAL_RE.test(n)) continue; GSER.set(serKey(sn), canonical.get(n) || aliasOf.get(normName(n)) || n); }
    const byClient = new Map();
    for (const r of rows) {
      const raw = (r["Client"] || "").trim(); if (!raw) continue;
      if (isNoteRow(r)) continue;
      const name = canonical.get(raw) || raw;
      if (/^UNKNOWN\s*[–-]\s*possibly/i.test(raw)) continue;
      if (excludeRe && (excludeRe.test(name) || /^UNKNOWN\b/i.test(name))) continue;
      if (!byClient.has(name)) byClient.set(name, { name, key: slug(name), rows: [], dealIds: new Set(), pos: new Set(), sos: new Set(), altKeys: [] });
      const c = byClient.get(name); c.rows.push(r);
      if (raw !== name && !c.altKeys.includes(slug(raw))) c.altKeys.push(slug(raw)); // folded spelling: keep its saved owner/notes
      const d = (r["PJ / deal"] || "").trim(); if (/^\d+$/.test(d)) c.dealIds.add(+d);
      if (r["T3D PO"]) c.pos.add(r["T3D PO"]); if (r["NP sales order"]) c.sos.add(r["NP sales order"]);
    }
    const qboOnly = [];
    if (opts.qbo) {
      const list = [...byClient.values()];
      const sk = new Set(opts.qbo.seckeyInvoices || []);
      list.forEach((c) => (c.seckeyInv = sk));
      const groups = new Map();
      for (const [cust, lines] of Object.entries(opts.qbo.customers)) for (const l of lines) {
        const target = l[4] || cust;
        if (!groups.has(target)) groups.set(target, { name: target, lines: [] });
        groups.get(target).lines.push({ cust, ym: l[0], code: l[1], qty: l[2], inv: l[3], extra: l[5] || "" });
      }
      const bucket = new Map();
      for (const g of groups.values()) {
        const best = (opts.qbo.separate || []).includes(g.name) ? null : bestMatch(g.name, list);
        const key = ([...distinct(g.name)].sort().join("-") || slug(g.name)) + (deptOf(g.name) ? "-" + slug(deptOf(g.name)) : "") + (instType(g.name) ? "-" + instType(g.name) : "");
        // remember the key this customer had as a QuickBooks-only client, so owners/notes saved under it carry over
        if (best) { (best.qbo = best.qbo || []).push(...g.lines); (best.altKeys = best.altKeys || []).push("qbo-" + slug(key)); continue; }
        if (!bucket.has(key)) bucket.set(key, { name: g.name, key: "qbo-" + slug(key), rows: [], dealIds: new Set(), pos: new Set(), sos: new Set(), qbo: [], source: "quickbooks", seckeyInv: new Set(opts.qbo.seckeyInvoices || []) });
        const b = bucket.get(key); b.qbo.push(...g.lines); if (g.name.length < b.name.length) b.name = g.name;
      }
      qboOnly.push(...bucket.values());
    }
    const ovAll = opts.overrides || {};
    for (const c of byClient.values()) c.overrides = ovAll[c.key];
    for (const c of qboOnly) c.overrides = ovAll[c.key];
    const clients = [];
    // rows the sheet marks "UNKNOWN – possibly <client>": shown on that client as serials to confirm, never counted
    const allC = [...byClient.values(), ...qboOnly];
    for (const [sug, prs] of possibles) {
      const tgt = canonical.get(sug) || aliasOf.get(normName(sug)) || sug;
      const c = allC.find((x) => x.name === tgt) || bestMatch(tgt, allC);
      if (c) (c.possibles = c.possibles || []).push(...prs);
    }
    for (const c of byClient.values()) clients.push(buildClient(c, today, soon));
    for (const c of qboOnly) { if (excludeRe && excludeRe.test(c.name)) continue; const b = buildClient(c, today, soon); b.score -= 10; clients.push(b); }
    return clients;
  }

  // Duplex mode (markers + markerless at once): PrimeX-series cameras, Motive 3.3+ (3.3.3 for PrimeX 13/13W), Body or Body Unlimited licence
  const PRIMEX_RE = /Prime\s*X\s*(13|22|41|120|260)\s*W?/i;
  function duplexOf(hw, licences) {
    const items = (hw || []).filter((h) => PRIMEX_RE.test(h.product || ""));
    const cams = items.reduce((n, h) => n + (h.qty || 1), 0);
    if (!cams) return null;
    const models = [...new Set(items.map((h) => (h.product.match(PRIMEX_RE) || [""])[0].replace(/\s+/g, " ").replace(/Prime\s*X/i, "PrimeX")))];
    const body = (licences || []).some((l) => !l.superseded && /Body/.test(l.edition) && l.major === 3);
    const min = items.some((h) => /Prime\s*X\s*13/i.test(h.product)) ? "3.3.3" : "3.3.0";
    return { cams, models, body, min };
  }

  function buildClient(c, today, soon) {
    const lic = [], maint = [], hw = [], gaps = [], other = [];
    let lastShip = null;
    for (const r of c.rows) {
      const type = r["Item type"] || "", prod = r["Product"] || "", serial = r["Serial number"] || "";
      const ship = parseDate(r["Ship date"]); if (ship && (!lastShip || ship > lastShip)) lastShip = ship;
      if (/maintenance/i.test(type) || /maintenance/i.test(prod)) maint.push({ r, ship, ...editionOf(prod, serial) });
      else if (/^licen[cs]e$/i.test(type) || /^Motive:/i.test(prod)) lic.push({ r, ship, ...editionOf(prod, serial) });
      else if (GAP_TYPES.test(type) || (!type && !prod)) gaps.push(r);
      else if (/no serialised/i.test(type)) other.push(r);
      else hw.push(r);
    }
    // licences
    const licences = lic.map((l) => {
      const est = parseDate(l.r["Est. maintenance end (ship + 12 mo)"]);
      const end = est || (l.ship ? addYears(l.ship, 1) : null);
      return { edition: l.edition, major: l.major, serial: l.r["Serial number"], hash: l.r["Licence hash"], product: l.r["Product"], ship: l.ship, end, renewals: [], source: "Licence row " + l.r._row, sheetStatus: l.r["Status today"] || "", so: l.r["NP sales order"] || "", po: l.r["T3D PO"] || "", deal: l.r["PJ / deal"] || "" };
    });
    // apply maintenance rows
    for (const m of maint) {
      const end = parseDate(m.r["Est. maintenance end (ship + 12 mo)"]) || (m.ship ? addYears(m.ship, 1) : null);
      const digits = (m.r["Serial number"] || "").replace(/\D/g, "");
      let target = licences.find((l) => l.major === m.major && l.edition === m.edition && (l.serial || "").replace(/\D/g, "") === digits);
      if (!target) target = licences.filter((l) => l.major === m.major && l.edition === m.edition).sort((a, b) => (a.end || 0) - (b.end || 0))[0];
      if (!target) { target = { edition: m.edition, major: m.major, serial: m.r["Serial number"], hash: m.r["Licence hash"], product: m.r["Product"].replace(/\s*Maintenance.*$/i, ""), ship: null, end: null, renewals: [], source: "Inferred from maintenance row " + m.r._row, inferred: true, sheetStatus: m.r["Status today"] || "" }; licences.push(target); }
      target.renewals.push({ date: m.ship, end, serial: m.r["Serial number"] });
      if (end && (!target.end || end > target.end)) target.end = end;
    }
    // QuickBooks invoices (licence / maintenance lines matched to this client)
    const qboFindings = [];
    const qboLines = (c.qbo || []).filter((q) => q.qty > 0 && q.code !== "HW");
    const qboHw = (c.qbo || []).filter((q) => q.qty > 0 && q.code === "HW");
    if (qboLines.length) {
      const resolved = [];
      for (const q of qboLines) {
        let info = qboCode(q.code, q.ym);
        if (!info) continue;
        if (info.ambiguous && info.major === 2 && c.seckeyInv && c.seckeyInv.has(q.inv)) info = { ...info, major: 3, ambiguous: false, label: info.label.replace(" 2 ", " 3 ") };
        let major = info.major;
        if (major == null) {
          const same = licences.filter((l) => l.edition === info.edition);
          major = same.length ? same.sort((x, y) => y.major - x.major)[0].major : (q.ym >= "2022-05" ? 3 : 2);
        }
        resolved.push({ ...q, info, major, d: ymDate(q.ym) });
      }
      resolved.sort((x, y) => x.d - y.d);
      // 1) licence purchases: skip ones already in the sheet, group split invoices into one purchase
      const purchases = [];
      for (const r of resolved.filter((x) => x.info.kind === "lic")) {
        let inSheet = r.extra ? licences.find((l) => !l.fromQBO && l.serial && r.extra.includes(l.serial)) : null;
        if (inSheet) { inSheet._q = true; inSheet.inv = inSheet.inv || r.inv; continue; }
        inSheet = licences.find((l) => !l.fromQBO && l.edition === r.info.edition && l.major === r.major && l.ship && Math.abs(l.ship - r.d) <= 75 * DAY && !l._q);
        if (!inSheet) inSheet = licences.find((l) => !l.fromQBO && l.inferred && !l.ship && l.edition === r.info.edition && l.major === r.major && !l._q);
        if (inSheet) { inSheet._q = true; inSheet.inv = inSheet.inv || r.inv; if (!inSheet.ship) { inSheet.ship = r.d; inSheet.source += ` · purchase in QuickBooks #${r.inv}`; } continue; }
        const prev = r.extra ? null : purchases.find((p) => !p.serial && p.edition === r.info.edition && p.major === r.major && r.d - p.last <= 150 * DAY);
        if (prev) { prev.qty += r.qty; prev.last = r.d; prev.lines.push(r); if (r.info.ambiguous) prev.ambiguous = true; }
        else purchases.push({ edition: r.info.edition, major: r.major, qty: r.qty, first: r.d, last: r.d, lines: [r], ambiguous: !!r.info.ambiguous, label: r.info.label, serial: r.extra || "" });
      }
      for (const p of purchases) {
        const n = Math.max(1, Math.round(p.qty));
        const invs = [...new Set(p.lines.map((x) => "#" + x.inv))].join(", ");
        licences.push({ edition: p.edition, major: p.major, serial: p.serial, hash: "", product: `Motive:${p.edition} ${p.major}`, ship: p.first, end: addYears(p.last, 1), renewals: [], source: `QuickBooks ${invs}`, fromQBO: true, qty: n, sheetStatus: "", inv: p.lines[0].inv, invs: p.lines.map((x) => x.inv), bundle: p.lines[0].info.code });
        qboFindings.push({ kind: "missing", text: `QuickBooks ${invs} (${fmtYm(p.lines[0].ym)}): ${n > 1 ? n + " × " : ""}${p.lines[0].info.code === "TRIO" ? "Duo/Trio bundle with Motive:Tracker " + p.major : p.lines[0].info.code === "SYS2" ? "system bundle with Motive " + p.major + " licence" : "Motive:" + p.edition + " " + p.major}${p.ambiguous ? " (sold on a 2.X item after Motive 3 launched, no Security Key on the invoice: version unconfirmed)" : ""} is not in the serials sheet.` });
      }
      // 2) maintenance purchases extend the licence they belong to
      for (const r of resolved.filter((x) => x.info.kind === "mnt")) {
        const qEnd = addYears(r.d, 1);
        const cands = licences.filter((l) => l.edition === r.info.edition && l.major === r.major && (!l.ship || l.ship <= new Date(r.d.getTime() + 60 * DAY)));
        const t = cands.sort((x, y) => (y.end || 0) - (x.end || 0))[0];
        if (t) {
          if (!t.end || qEnd > new Date(t.end.getTime() + 45 * DAY)) {
            qboFindings.push({ kind: "renewal", text: t.fromQBO
              ? `QuickBooks #${r.inv} (${fmtYm(r.ym)}): ${r.info.label}${r.qty > 1 ? " × " + r.qty : ""} renewed the QuickBooks licence above, to about ${fmt(qEnd)}.`
              : `QuickBooks #${r.inv} (${fmtYm(r.ym)}): ${r.info.label}${r.qty > 1 ? " × " + r.qty : ""} is not in the serials sheet. Maintenance likely runs to about ${fmt(qEnd)}${t.end ? ", not " + fmt(t.end) : ""}.` });
            t.renewals.push({ date: r.d, end: qEnd, serial: "QBO #" + r.inv, qbo: true });
            t.end = qEnd; t.qbo = true;
          }
        } else {
          licences.push({ edition: r.info.edition, major: r.major, serial: "", hash: "", product: `Motive:${r.info.edition} ${r.major}`, ship: null, end: qEnd, renewals: [{ date: r.d, end: qEnd, serial: "QBO #" + r.inv, qbo: true }], source: `Inferred from QuickBooks maintenance #${r.inv}`, fromQBO: true, inferred: true, sheetStatus: "" });
          qboFindings.push({ kind: "missing", text: `QuickBooks #${r.inv} (${fmtYm(r.ym)}): ${r.info.label} invoiced, but no matching licence is in the serials sheet.` });
        }
      }
    }
    // a Motive 2 licence is superseded once a Motive 3 licence of the same edition was bought after it lapsed (or within its last year)
    for (const l of licences) if (l.major === 2 && l.end && licences.some((m) => m.major === 3 && m.edition === l.edition && m.ship && m.ship >= new Date(l.end.getTime() - 365 * DAY))) l.superseded = true;
    // ---------- gap filling from Gmail / Drive evidence (high & medium confidence only) ----------
    const gfAll = GF.filter((g) => g.c.toLowerCase() === String(c.name).toLowerCase());
    const gf = gfAll.filter((g) => g.conf !== "low");
    const gfFindings = []; let gfFilled = 0;
    const seenSer = new Set();
    for (const g of gf.slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""))) for (const e of g.lic || []) {
      if (!e.serial || !isMotiveSerial(e.serial) || seenSer.has(serKey(e.serial))) continue; seenSer.add(serKey(e.serial));
      if (licences.some((l) => serKey(l.serial) === serKey(e.serial) || (l.moreSerials || []).some((x) => serKey(x) === serKey(e.serial)))) continue;
      const eo = editionOf("", e.serial);
      const major = e.major || eo.major, ed = e.edition || eo.edition;
      const end = e.maintenance_end ? parseDate(e.maintenance_end) : null;
      const where = `${SRC[g.src] || g.src} (${g.date || "undated"})`;
      const owner = GSER.get(serKey(e.serial));
      if (owner && owner !== c.name) { gfFindings.push({ kind: "elsewhere", text: `${where} mentions ${e.serial}, which the sheet/QuickBooks already lists under "${owner}".` }); continue; }
      if (isUpdateSerial(e.serial)) {
        // a maintenance-update serial: evidence of a renewal, not a separate licence
        const t = licences.filter((l) => !l.superseded && l.major === major && (l.edition === ed || l.edition === "Unknown")).sort((a, b) => (b.end || 0) - (a.end || 0))[0];
        if (t && end && (!t.end || end > t.end)) {
          t.renewals.push({ date: parseDate(g.date), end, serial: e.serial, gf: true }); t.end = end; gfFilled++;
          gfFindings.push({ kind: "renewal", text: `Maintenance renewal ${e.serial} (${ed} ${major}) delivered ${fmt(parseDate(g.date))} per ${where}: ${ed} ${major} maintenance extended to ${fmt(end)}.` });
        } else gfFindings.push({ kind: "renewal-old", text: `Maintenance renewal ${e.serial} (${ed} ${major}${end ? `, to ${fmt(end)}` : ""}) per ${where}. ${t ? "Already covered by a later date on record." : "No current licence of that edition to apply it to (older licence)."}` });
        continue;
      }
      // a licence of the same edition with room for another serial (multi-licence orders hold several);
      // current licences first, then superseded Motive 2 ones, nearest ship date to the evidence first
      const gd = parseDate(g.date);
      const room = (l) => (l.serial ? 1 : 0) + (l.moreSerials || []).length < (l.qty || 1);
      const slot = licences.filter((l) => room(l) && l.major === major && (l.edition === ed || l.edition === "Unknown"))
        .sort((a, b) => (a.superseded ? 1 : 0) - (b.superseded ? 1 : 0) || (gd && a.ship && b.ship ? Math.abs(a.ship - gd) - Math.abs(b.ship - gd) : 0))[0];
      if (slot && slot.serial) {
        (slot.moreSerials = slot.moreSerials || []).push(e.serial); gfFilled++;
        gfFindings.push({ kind: "serial", text: `Serial ${e.serial} (${ed} ${major}) found in ${where} and added to the ${slot.qty || 1}-licence ${ed} ${major} order.` });
      } else if (slot) {
        slot.serial = e.serial; slot.serialSrc = g.src; gfFilled++;
        let extra = "";
        if (!slot.end && end) { slot.end = end; extra = ` Maintenance end ${fmt(end)} taken from the same source.`; }
        gfFindings.push({ kind: "serial", text: `Serial ${e.serial} (${ed} ${major}) found in ${where} and added to the ${ed} ${major} licence.${extra}` });
      } else {
        gfFindings.push({ kind: "unplaced", text: `${where}: ${ed} ${major} licence ${e.serial}${end ? `, maintenance to ${fmt(end)}` : ""} is mentioned but isn't in the sheet or QuickBooks. Confirm whether it's still in use${major === 2 ? " (Motive 2 key)" : ""}.` });
      }
    }
    // latest concrete statement of the Motive version in use (or that the system is idle)
    const mi = gf.filter((g) => g.mi && /\b\d\.\d+(\.\d+)?\b|not in use|shelved|unused|idle/i.test(g.mi)).sort((a, b) => (b.date || "").localeCompare(a.date || ""))[0];
    if (mi) gfFindings.push({ kind: "version", text: `Motive in use: ${mi.mi} (${SRC[mi.src] || mi.src}, ${mi.date || "undated"}).` });

    for (const l of licences) {
      l.runnable = maxRunnable(l.major, l.end);
      l.state = !l.end ? "unknown" : l.end < today ? "expired" : l.end < soon ? "expiring" : "active";
      l.daysLeft = l.end ? Math.round((l.end - today) / DAY) : null;
      l.plan = l.superseded ? { action: "none", title: "Superseded", detail: "A later Motive 3 licence of the same edition replaced this one. No action unless the old key is still in use on another system.", usd: null } : planFor(l, today);
    }
    // hardware: sheet rows + QuickBooks hardware lines not already covered by the sheet
    const hwItems = hw.map((r) => {
      const rule = hwRule(r["Product"]);
      return { product: r["Product"], type: r["Item type"], serial: r["Serial number"], rule, min: hwMin(rule, r["Serial number"]), ship: parseDate(r["Ship date"]), so: r["NP sales order"] || "", po: r["T3D PO"] || "", deal: r["PJ / deal"] || "", qty: 1, src: "sheet" };
    });
    for (const q of qboHw) {
      const d = ymDate(q.ym), rule = hwRule(q.extra);
      if (!rule || rule.kind === "Key") continue;
      // consume matching sheet items one-for-one so a second order of the same kind isn't hidden by the first
      let need = Math.max(1, Math.round(q.qty));
      for (const h of hwItems) {
        if (!need) break;
        if (h.src === "sheet" && !h._used && h.rule && h.rule.id === rule.id && h.ship && Math.abs(h.ship - d) <= 120 * DAY) { h._used = true; need--; }
      }
      if (!need) continue;
      const n = need;
      const product = String(q.extra).replace(/\s*\(split across[^)]*\)\s*$/, "");
      hwItems.push({ product, type: rule.kind, serial: "", rule, min: hwMin(rule, ""), ship: d, so: "", po: "", deal: "", inv: q.inv, qty: n, src: "qbo" });
      if (rule.kind === "Camera") qboFindings.push({ kind: "hardware", text: `QuickBooks #${q.inv} (${fmtYm(q.ym)}): ${n} × ${q.extra} invoiced but not itemised in the serials sheet.` });
    }
    const groupHw = (items) => {
      const m = new Map();
      for (const h of items) {
        const k = (h.rule ? h.rule.id : "?") + "|" + h.product;
        if (!m.has(k)) m.set(k, { key: k, product: h.product, rule: h.rule, type: h.type, count: 0, serials: [], min: null, qbo: false });
        const g = m.get(k); g.count += h.qty; if (h.serial) g.serials.push(h.serial); g.min = vmax(g.min, h.min); if (h.src === "qbo") g.qbo = true; if (h.src === "evidence") g.ev = true;
      }
      return [...m.values()].sort((x, y) => (y.rule && y.rule.kind === "Camera") - (x.rule && x.rule.kind === "Camera") || y.count - x.count);
    };
    // cameras from Gmail/Drive only when nothing else lists any hardware for this client
    if (!hwItems.some((h) => h.rule && h.rule.kind === "Camera")) {
      const best = new Map();
      for (const g of gf) for (const cm of g.cams || []) {
        if (!(cm.qty > 0)) continue; const r = hwRule(cm.model); if (!r || r.kind !== "Camera") continue;
        const k = cm.model.replace(/\s+/g, " ").toLowerCase();
        if (!best.has(k) || best.get(k).qty < cm.qty) best.set(k, { ...cm, g, r });
      }
      for (const v of best.values()) {
        hwItems.push({ product: v.model, type: v.r.kind, serial: "", rule: v.r, min: hwMin(v.r, ""), ship: parseDate(v.g.date), so: "", po: "", deal: "", qty: v.qty, src: "evidence" });
        gfFilled++;
        gfFindings.push({ kind: "hardware", text: `${v.qty} × ${v.model} taken from ${SRC[v.g.src] || v.g.src} (${v.g.date || "undated"}): "${v.g.title}". No camera list in the sheet or QuickBooks.` });
      }
    }
    const hwGroups = groupHw(hwItems);
    const isCam = (h) => (h.rule ? h.rule.kind === "Camera" : /camera/i.test(h.type));
    const cameras = hwItems.filter(isCam).reduce((n, h) => n + h.qty, 0);
    const hasUsbAll = hwItems.some((h) => h.rule && h.rule.usb);

    // ---------- systems: one per licence order (sales order / invoice), hardware attached by order, deal or PO ----------
    const live = licences.filter((l) => !l.superseded);
    const sysMap = new Map();
    live.forEach((l, i) => {
      const id = l.so ? "so:" + l.so : l.inv ? "inv:" + l.inv : "lic:" + (l.serial || i);
      if (!sysMap.has(id)) sysMap.set(id, { id, licences: [], hw: [], so: l.so || "", inv: l.inv || "", deal: l.deal || "", po: l.po || "", ship: l.ship || null });
      const sy = sysMap.get(id); sy.licences.push(l); if (l.ship && (!sy.ship || l.ship < sy.ship)) sy.ship = l.ship;
    });
    const systemsArr = [...sysMap.values()];
    const unassigned = [];
    const ov = (c.overrides && c.overrides.assign) || {};
    for (const h of hwItems) {
      const hk = (h.so || (h.inv ? "#" + h.inv : "")) + "|" + h.product;
      h.hk = hk;
      let sy = ov[hk] ? sysMap.get(ov[hk]) : null;
      if (!sy && ov[hk] === "__none") { unassigned.push(h); continue; }
      if (!sy && h.so) sy = sysMap.get("so:" + h.so);
      if (!sy && h.inv) sy = sysMap.get("inv:" + h.inv);
      if (!sy && h.deal) sy = systemsArr.find((x) => x.deal && x.deal === h.deal);
      if (!sy && h.po) sy = systemsArr.find((x) => x.po && x.po === h.po);
      if (!sy && systemsArr.length === 1) { sy = systemsArr[0]; h.addon = true; }
      if (!sy && h.ship) {
        const near = systemsArr.filter((x) => x.ship && Math.abs(x.ship - h.ship) <= 120 * DAY).sort((x, y) => Math.abs(x.ship - h.ship) - Math.abs(y.ship - h.ship))[0];
        if (near) { sy = near; h.byDate = true; }
      }
      if (sy) sy.hw.push(h); else unassigned.push(h);
    }
    const labels = (c.overrides && c.overrides.labels) || {};
    const issues = [];
    const systems = systemsArr.map((sy) => {
      const v3s = sy.licences.filter((l) => l.major === 3), v2s = sy.licences.filter((l) => l.major === 2);
      const ends = sy.licences.map((l) => l.end).filter(Boolean).sort((x, y) => y - x);
      const runnable = v3s.map((l) => l.runnable).filter(Boolean).sort((x, y) => vcmp(y, x))[0] || null;
      const hwG = groupHw(sy.hw);
      const cams = sy.hw.filter(isCam).reduce((n, h) => n + h.qty, 0);
      const reqMin = sy.hw.reduce((m, h) => vmax(m, h.min), null);
      const usb = sy.hw.some((h) => h.rule && h.rule.usb);
      const keys = sy.hw.filter((h) => h.rule && h.rule.kind === "Key");
      const states = sy.licences.map((l) => (l.major === 2 ? "motive2" : l.state));
      const st = states.includes("expired") && states.some((x) => x === "active" || x === "expiring") ? "partial" : states.includes("expired") ? "expired" : states.includes("motive2") && !states.some((x) => x === "active" || x === "expiring") ? "motive2" : states.includes("expiring") ? "expiring" : states.includes("unknown") ? "unknown" : "active";
      const mainCam = hwG.find((g) => g.rule && g.rule.kind === "Camera");
      const licTxt = (() => { const g = {}; sy.licences.forEach((l) => { const k = `${l.edition} ${l.major}`; g[k] = (g[k] || 0) + (l.qty || 1); }); return Object.entries(g).map(([k, n]) => (n > 1 ? n + " × " : "") + k).join(" + "); })();
      const auto = [licTxt, cams ? `${cams} × ${mainCam ? mainCam.product.replace(/\s*\(.*\)/, "") : "camera"}` : null, sy.ship ? sy.ship.getUTCFullYear() : null].filter(Boolean).join(" · ");
      const label = labels[sy.id] || auto;

    c.pdLic = st.pd.lic.filter((d) => c.orgIds.includes(d.org_id) || (st.pd.orgs.get(d.org_id) && nameMatch(c.name, st.pd.orgs.get(d.org_id).name)));
    c.pdLic.forEach((d) => matched.add(d.org_id));
    c.orgIds.forEach((o) => matched.add(o));
    c.persons = [...new Set([...c.deals, ...c.pdLic].map((d) => d.person_id).filter(Boolean))].map((id) => st.pd.persons.get(id)).filter(Boolean);
  }
  let extra = [];
  if (st.pd.state === "ok") {
    extra = E.pipedriveOnly(st.pd.lic, st.pd.orgs, matched);
    for (const c of extra) { c.deals = []; c.pdLic = c.pdDeals; c.persons = [...new Set(c.pdDeals.map((d) => d.person_id).filter(Boolean))].map((id) => st.pd.persons.get(id)).filter(Boolean); }
  }
  st.clients = [...base, ...extra].map((c) => { c.gapfill = (typeof GAPFILL !== "undefined" ? GAPFILL : []).filter((g) => g.c.toLowerCase() === c.name.toLowerCase()); c.evidence = EVIDENCE.filter((ev) => (ev.clients || []).some((n) => n.toLowerCase() === c.name.toLowerCase()) || (c.source === "pipedrive" && (ev.match || []).some((m) => c.name.toLowerCase().includes(m) || c.orgIds.some((o) => (st.pd.orgs.get(o)?.name || "").toLowerCase().includes(m))))); return c; });
  st.clients.forEach((c) => { c.prio = E.priority(c, today); c.score = c.prio.total; });
  st.clients.sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
  st.dupes = E.likelyDuplicates(st.clients);
  render();
}
const GENERIC = new Set(["university", "college", "london", "royal", "centre", "center", "research", "institute", "studio", "studios", "group", "academia", "biomechanics", "medical", "computing", "mocap", "proto", "new", "city", "east", "north", "south", "west", "national", "school"]);
function nameMatch(a, b) { return E.sameOrg(a, b); }
// campaign record for a client; falls back to records saved under an older name/key for the same client
const campOf = (c) => st.campaign.get(c.key) || (c.altKeys || []).map((k) => st.campaign.get(k)).find(Boolean) || {};
const stageOf = (c) => campOf(c).stage || "Not started";

function visible() {
  const f = st.filter, q = f.q.trim().toLowerCase();
  return st.clients.filter((c) => {
    if (f.status && c.status !== f.status) return false;
    if (f.src !== "all" && c.source !== f.src) return false;
    if (f.block && !c.issues.some((i) => i.sev === "block")) return false;
    if (f.qbo && !(c.qboFindings || []).length) return false;
    if (f.dx && !c.duplex) return false;
    if (f.gf && !c.gfFilled) return false;
    if (f.mine && !isMine(c)) return false;
    if (f.due && !(dueOf(c) && (dueOf(c).overdue || dueOf(c).soon) && (!myName() || isMine(c) || !st.clients.some(isMine)))) return false;
    if (f.won && !dealOf(c)) return false;
    if (st.preset) { const p = PRESETS.find((x) => x.id === st.preset); if (p && !p.test(c)) return false; }
    if (f.own && !ownerOf(c)) return false;
    if (f.lead && !hasLead(c)) return false;
    if (f.deal && !hasDeal(c)) return false;
    if (f.stage !== "all" && stageOf(c) !== f.stage) return false;
    if (f.owner !== "all" && (f.owner === "__none" ? ownerOf(c) : ownerOf(c) !== f.owner)) return false;
    if (q) {
      const hay = [c.name, ...c.licences.map((l) => l.serial + " " + l.edition + " " + (l.hash || "")), ...c.hwGroups.map((g) => g.product + " " + g.serials.join(" ")), ...(c.persons || []).map((p) => p.name + " " + (p.emails || []).map((e) => e.value).join(" ")), ...c.pos, ...c.sos, ...c.dealIds, ...(c.qboLines || []).map((q) => "#" + q.inv + " " + q.cust), ...(c.gapfill || []).map((g) => g.lic.map((l) => l.serial).join(" "))].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

  const deals = (c.deals || []).map((d) => {

    const link = (u, t) => u && /^https?:/.test(String(u).trim()) ? `<a href="${esc(String(u).trim())}" target="_blank" rel="noopener">${t}</a>` : "";
    return `<li><span class="mono">#${d.id}</span> ${esc(d.title.replace(/^\d+-/, ""))} <span class="sub">${d.status}${d.won_time ? " " + d.won_time.slice(0, 10) : ""}</span> ${link(q, "QuickBooks")} ${link(dr, "Drive folder")}</li>`;
  }).join("");
  const lic = (c.pdLic || []).map((d) => `<li><span class="mono">#${d.id}</span> ${esc(PD_STAGE[d.stage_id] || "")}${d.status === "lost" ? " (lost)" : ""} <span class="sub">updated ${esc((d.update_time || "").slice(0, 10))}</span></li>`).join("");
  const people = (c.persons || []).map((p) => {
    const em = (p.emails || []).find((e) => e.primary) || (p.emails || [])[0];

    return `<li><b>${esc(p.name)}</b>${em && em.value ? ` <span class="copyline"><span class="mono">${esc(em.value)}</span><button type="button" class="ghost" data-copy="${esc(em.value)}" aria-label="Copy email">Copy</button></span>` : ""}${ph && ph.value ? `<div class="sub mono">${esc(ph.value)}</div>` : ""}</li>`;
  }).join("");
  if (!deals && !lic && !people) return `<p class="small muted">No linked deal. Add the Pipedrive deal number to the sheet's “PJ / deal” column to link it.</p>`;
  return `${people ? `<h3 class="k" style="margin-top:4px">Contacts</h3><ul class="small" style="padding-left:18px;margin:0 0 8px">${people}</ul>` : ""}

    ${lic ? `<h3 class="k">Licensing pipeline</h3><ul class="small" style="padding-left:18px;margin:0">${lic}</ul>` : ""}`;
}

// Pipedrive owner for a new deal/lead: the client's sales owner, else the person using the tool ("You are")
function pdOwnerFor(c) {
  const name = ownerOf(c) || (st.host === "netlify" ? meName() : "");
  const users = st.pd.users || [];
  if (!name) return { name: "", user: null, why: "No sales owner set" };
  const n = name.trim().toLowerCase();
  const user = users.find((u) => (u.name || "").trim().toLowerCase() === n)
    || users.find((u) => { const un = (u.name || "").toLowerCase(); const [f, ...rest] = n.split(/\s+/); return un.startsWith(f + " ") && rest.length && un.endsWith(rest[rest.length - 1]); })
    || null;
  return { name, user, why: user ? "" : users.length ? `No Pipedrive user called "${name}"` : "Pipedrive users aren't available here" };
}
function ownerLine(c) {
  const o = pdOwnerFor(c);
  return o.user ? `${esc(o.user.name)}${ownerOf(c) ? "" : " (you)"}` : `Pipedrive default (the API token's user)<div class="sub">${esc(o.why)}</div>`;
}
function dealValue(c) { return Math.round(c.licences.reduce((s, l) => s + (l.plan.usd || 0), 0) * st.gbp); }
function dealConfirm(c) {
  const org = c.orgIds[0], person = (c.persons[0] || {}).id;
  const expired = ["expired", "partial", "motive2"].includes(c.status);
  return `<div class="confirm"><b>Create in Pipedrive → OPTITRACK LICENSING</b>

    <dt>Owner</dt><dd>${ownerLine(c)}</dd>

/* ---------- sales owner (shared) ---------- */
const SALES_TEAM = ["Jack Weston", "Ashley Keeler", "Allan Rankin", "Ruslana Bletska", "Charlie Wadey"];
st.ownerEdit = null;
const ownerOf = (c) => campOf(c).owner || "";
const hasLead = (c) => { const x = campOf(c); return !!(x.pdLead || x.pdLeadAt); };
const hasDeal = (c) => { const x = campOf(c); return !!(x.pdDeal || x.pdDealAt); };
function ownerNames() {
  const custom = [...new Set([...st.campaign.values()].map((x) => x.owner).filter((n) => n && !SALES_TEAM.includes(n)))].sort();
  return [...SALES_TEAM, ...custom];
}
function ownerControl(c, where) {
  const cur = ownerOf(c), id = where + "::" + c.key;
  if (!st.db) return cur ? esc(cur) : `<span class="sub">—</span>`;
  if (st.ownerEdit === id) return `<input class="own-in" data-own-in="${esc(c.key)}" data-where="${where}" maxlength="60" placeholder="Type a name, Enter to save" aria-label="Sales owner for ${esc(c.name)}" value="${esc(SALES_TEAM.includes(cur) ? "" : cur)}">`;
  return `<select class="own-sel" data-own="${esc(c.key)}" data-where="${where}" aria-label="Sales owner for ${esc(c.name)}"><option value="">Unassigned</option>${ownerNames().map((n) => `<option ${n === cur ? "selected" : ""}>${esc(n)}</option>`).join("")}<option value="__other">Other…</option></select>`;
}
async function setOwner(c, name) {
  name = (name || "").trim().slice(0, 60);
  const prev = campOf(c);
  const doc = { ...prev, owner: name, client: c.name, stage: prev.stage || "Not started", updatedAt: new Date().toISOString(), by: st.userId || null };
  st.campaign.set(c.key, doc); st.ownerEdit = null; renderList();
  try { await st.db.collection("campaign").doc(c.key).set(doc); toast(name ? `${name} is chasing ${c.name}` : "Owner cleared"); }
  catch (e) { st.campaign.set(c.key, prev); renderList(); toast(e && e.code === "not_granted" ? "You have view-only access, so the owner can't be changed." : "Couldn't save the owner (" + (e && e.code || "error") + ")."); }
}
function bindOwners(root) {
  root.querySelectorAll("select[data-own]").forEach((sel) => {
    sel.onclick = (ev) => ev.stopPropagation();
    sel.onchange = () => {
      const c = st.clients.find((x) => x.key === sel.dataset.own); if (!c) return;
      if (sel.value === "__other") { st.ownerEdit = sel.dataset.where + "::" + c.key; renderList(); const i = document.querySelector(`input[data-own-in="${CSS.escape(c.key)}"][data-where="${sel.dataset.where}"]`); if (i) i.focus(); return; }
      setOwner(c, sel.value);
    };
  });
  root.querySelectorAll("input[data-own-in]").forEach((inp) => {
    const c = st.clients.find((x) => x.key === inp.dataset.ownIn); if (!c) return;
    let done = false;
    const commit = (save) => { if (done) return; done = true; if (save && inp.value.trim()) setOwner(c, inp.value); else { st.ownerEdit = null; renderList(); } };
    inp.onclick = (ev) => ev.stopPropagation();
    inp.onkeydown = (ev) => { ev.stopPropagation(); if (ev.key === "Enter") commit(true); if (ev.key === "Escape") commit(false); };
    inp.onblur = () => commit(true);
  });
}

const DAYMS = 86400000;
const isoDay = (d) => new Date(d).toISOString().slice(0, 10);
const addDays = (n) => isoDay(today.getTime() + n * DAYMS);
const myName = () => (st.host === "netlify" ? meName() : st.myName) || "";
const nextOf = (c) => campOf(c).next || "";
function dueOf(c) {
  const n = nextOf(c); if (!n) return null;
  const d = Math.round((Date.parse(n + "T00:00:00Z") - today.getTime()) / DAYMS);

function weekStats() {
  const since = Date.now() - 7 * DAYMS, people = {};
  const P = (n) => (people[n] = people[n] || { owned: 0, contacted: 0, overdue: 0, dueWeek: 0, deals: 0, leads: 0, won: 0, wonWeek: 0 });

  for (const c of st.clients) {

function renderQuality() {
  if (!st.rows) { $("#v-quality").innerHTML = `<div class="empty">Load the sheet first.</div>`; return; }
  const parent = new Map(); const find = (x) => { while (parent.get(x) !== x) x = parent.get(x); return x; };
  const byName = new Map(st.clients.map((c) => [c.name, c.key]));
  for (const [k, v] of st.dupes) { if (!parent.has(k)) parent.set(k, k); v.forEach((n) => { const k2 = byName.get(n); if (!k2) return; if (!parent.has(k2)) parent.set(k2, k2); parent.set(find(k2), find(k)); }); }
  const comps = new Map(); for (const k of parent.keys()) { const r = find(k); if (!comps.has(r)) comps.set(r, []); const c = st.clients.find((x) => x.key === k); if (c) comps.get(r).push(c.name); }
  const pairs = [...comps.values()].filter((g) => g.length > 1).map((g) => g.sort());
  const gaps = st.clients.filter((c) => c.gaps).sort((a, b) => b.gaps - a.gaps);
  const noDeal = st.clients.filter((c) => c.source === "sheet" && !c.dealIds.length && c.licences.length);
  const noHw = st.clients.filter((c) => c.licences.length && !c.cameras);
  const unknownHw = st.clients.flatMap((c) => c.hwGroups.filter((g) => !g.rule).map((g) => `${c.name}: ${g.product}`));
  const sec = (t, items, sub) => `<div class="panel"><h3 class="k">${t} (${items.length})</h3>${sub ? `<p class="small muted" style="margin-top:0">${sub}</p>` : ""}${items.length ? `<ul class="small" style="margin:0;padding-left:18px;columns:2 260px">${items.map((i) => `<li>${i}</li>`).join("")}</ul>` : `<p class="small muted">None.</p>`}</div>`;
  $("#v-quality").innerHTML = `<div class="prose"><h2>Gaps to close in the sheet</h2><p>Each fix here makes the upgrade plan more accurate. The sheet reloads live, so edits show up after Refresh.</p></div>`
    + sec("Possible duplicate client names", pairs.map((g) => esc(g.join(" · "))), "Same distinctive name. Merging them puts licences and cameras in one place.")
    + sec("In QuickBooks but missing from the sheet", st.clients.filter((c) => c.source !== "quickbooks" && (c.qboFindings || []).length).map((c) => `${esc(c.name)} <span class="muted">(${c.qboFindings.length})</span>`), "Licences or maintenance invoiced by Target3D that Lana's sheet doesn't record. Open the client for invoice numbers.")
    + sec("QuickBooks customers not in the sheet", st.clients.filter((c) => c.source === "quickbooks").map((c) => esc(c.name)), "Bought a Motive licence or maintenance from Target3D but have no NaturalPoint order in the sheet: mostly pre-2023 Motive 2 customers.")
    + sec("Order lines not itemised yet", gaps.map((c) => `${esc(c.name)} <span class="muted">(${c.gaps})</span>`), "Packing slip unread or missing, so licences and cameras on these orders aren't counted.")
    + sec("Licences with no cameras listed", noHw.map((c) => esc(c.name)), "Compatibility can't be checked without the camera models.")
    + sec("Licence rows with no Pipedrive deal number", noDeal.map((c) => esc(c.name)), "Add the deal in “PJ / deal” to pull contacts and QuickBooks links.")
    + sec("Hardware not covered by the rules", unknownHw.map(esc));
}

m findings add missing licence serials, maintenance dates and camera lists; low ones are reference only. New "Gaps filled from Gmail / Drive" filter and a findings panel on each client.</li><li><b>v1.5.0</b> (29 Oct 2026): Stricter client matching so different organisations are never merged: a shared city name is no longer enough (Birmingham University was folded into Clays Birmingham; Cambridge Consultants into University of Cambridge; Liverpool Institute for Performing Arts and The City of Liverpool College into Liverpool universities; Durham Psychology into Durham robotics; AMRC NW into Sheffield AMRC). Companies never match universities, different universities in the same city stay apart, and differently named departments stay separate. Drive evidence is pinned to exact client names. New ✓ Duplex flag and filter for PrimeX-series hardware.</li><li><b>v1.4.0</b> (28 Oct 2026): Sortable column headers (Client, Licences, Lapsed, Hardware, Est. value, Repeat, Priority). New priority model: recently lapsed first, then deal value, system size and repeat custom, with a per-client breakdown. CSV export includes the priority parts.</li><li><b>v1.3.0</b> (28 Oct 2026): Light / dark theme button in the header (remembers your choice in this browser; until you pick, it follows your device setting). Header now uses the full TARGET3D logo with wordmark.</li><li><b>v1.2.0</b> (28 Oct 2026): Multiple systems per client. Each licence order becomes its own system card with its own hardware, status and compatibility check; rename systems and move hardware between them (saved for everyone). QuickBooks camera and hardware invoice lines fill in kit missing from the sheet. Target3D design system applied.</li>

// Contents for the Help page: every section, plus the named items inside each section, with "back to contents" links
function buildHelpIndex() {
  const root = $("#v-help .prose"); if (!root) return;
  const slugify = (t) => "help-" + t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 48);
  const items = [];
  root.querySelectorAll(":scope > h2").forEach((h) => {
    h.id = slugify(h.textContent);
    const subs = [];
    let el = h.nextElementSibling;
    while (el && el.tagName !== "H2") {
      el.querySelectorAll(":scope > li").forEach((li) => {
        const b = li.querySelector(":scope > b:first-child"); if (!b) return;
        const label = b.textContent.replace(/[:.]\s*$/, "").replace(/\s*\(.*?\)\s*$/, "").trim();
        if (!label || label.length > 60 || /^v\d/.test(label)) return;
        li.id = slugify(h.textContent + "-" + label); subs.push({ id: li.id, label });
      });
      el = el.nextElementSibling;
    }
    items.push({ id: h.id, label: h.textContent, subs: h.textContent === "How to use it (getting started)" ? [] : subs });
    const back = document.createElement("a"); back.href = "#help"; back.className = "help-top"; back.textContent = "↑ Contents"; back.dataset.helpgo = "help-contents"; h.appendChild(back);
  });
  const nav = document.createElement("nav"); nav.className = "help-index"; nav.id = "help-contents"; nav.setAttribute("aria-label", "Help contents");
  nav.innerHTML = `<h2>Contents</h2><ol>${items.map((it) => `<li><a href="#help" data-helpgo="${it.id}">${esc(it.label)}</a>${it.subs.length ? `<ul>${it.subs.map((x) => `<li><a href="#help" data-helpgo="${x.id}">${esc(x.label)}</a></li>`).join("")}</ul>` : ""}</li>`).join("")}</ol>`;
  root.prepend(nav);
  $("#v-help").querySelectorAll("[data-helpgo]").forEach((a) => a.onclick = (ev) => {
    ev.preventDefault(); const t = document.getElementById(a.dataset.helpgo); if (!t) return;
    t.scrollIntoView({ behavior: "smooth", block: "start" }); t.classList.add("help-flash"); setTimeout(() => t.classList.remove("help-flash"), 1600);
  });
}

/* ---------- export ---------- */
async function exportCSV() {
  const v = sortClients(visible());
  const head = ["Client", "Sales owner", "Status", "Priority", "Priority band", "PrimeX cameras (Duplex-ready)", "Months since lapse", "Est. value GBP", "Order occasions", "Years buying", "Campaign stage", "Licences", "Maintenance end (latest)", "Runs up to", "Recommended", "List USD", "Cameras", "Hardware", "Blockers", "QuickBooks findings", "Source", "Systems", "Contact", "Email"];
  const q = (s) => `"${String(s ?? "").replace(/"/g, '""')}"`;
  const lines = [head.map(q).join(",")].concat(v.map((c) => {
    const ends = c.licences.map((l) => l.end).filter(Boolean).sort((a, b) => b - a);
    const p = (c.persons || [])[0]; const em = p && ((p.emails || []).find((e) => e.primary) || (p.emails || [])[0]);
    return [c.name, ownerOf(c), STATUS[c.status].label, c.score, c.prio.label, c.duplex ? c.duplex.cams : "", c.prio.months ?? "", c.prio.usd ? Math.round(c.prio.usd * st.gbp) : "", c.prio.occasions, c.prio.years, stageOf(c), c.licences.map((l) => `${l.edition} ${l.major} ${l.serial || ""}`.trim()).join("; "), ends[0] ? E.iso(ends[0]) : "", c.runnable || "", c.licences.map((l) => l.plan.title).join("; "), c.licences.reduce((s, l) => s + (l.plan.usd || 0), 0) || "", c.cameras, c.hwGroups.map((g) => `${g.count}x ${g.product}`).join("; "), c.issues.filter((i) => i.sev === "block").map((i) => i.text).join(" | "), (c.qboFindings || []).map((f) => f.text).join(" | "), c.source, c.systems.map((x) => x.label + " [" + x.status + "]").join("; "), p ? p.name : "", em ? em.value : ""].map(q).join(",");
  }));
  const data = lines.join("\r\n");
  if (st.downloads) { try { await st.downloads.save({ filename: `motive-upgrade-plan-${E.iso(today)}.csv`, data }); } catch (e) { if (e && e.code !== "cancelled") showText(data); } }
  else showText(data);
}

/* ---------- routing + wiring ---------- */

  document.querySelectorAll("nav.tabs a").forEach((a) => a.setAttribute("aria-current", a.dataset.view === view ? "page" : "false"));
  if (view === "compat") renderCompat(); if (view === "quality") renderQuality(); if (view === "help") renderHelp(); if (view === "renewals") renderRenewals(); if (view === "summary") renderSummary();
}
function render() { renderSources(); renderNotices(); renderStrip(); renderPresets(); renderList(); const v = (location.hash || "").slice(1); if (v === "renewals") renderRenewals(); if (v === "summary") renderSummary(); if (v === "quality") renderQuality(); }
window.addEventListener("hashchange", route);

/* ---------- Netlify hosting: same interface as the claude.ai capabilities, backed by /api/* functions ---------- */
const meName = () => { let n = ""; try { n = localStorage.getItem("mup.me") || ""; } catch (e) {} return n || (st && st.hostInfo && st.hostInfo.user) || ""; };
async function netlifyClaude() {
  let info;
  try { const r = await fetch("/api/motive/health", { credentials: "same-origin", cache: "no-store" }); if (!r.ok) return null; info = await r.json(); if (!info || !info.ok) return null; } catch (e) { return null; }
  st.host = "netlify"; st.hostInfo = info;
  const api = async (path, body) => {
    const r = await fetch("/api/motive/" + path, { method: body ? "POST" : "GET", headers: body ? { "content-type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined, credentials: "same-origin", cache: "no-store" });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw { code: r.status === 401 ? "not_granted" : (j.code || "upstream_error"), message: j.message || r.statusText, retryable: r.status === 409 || r.status >= 500 };
    return j;
  };
  st.api = api;
  // shared state: every open browser polls once a minute (and when the tab regains focus); writes go straight to the server
  const listeners = new Map();
  const snap = (docs) => ({ docs: Object.entries(docs || {}).map(([id, data]) => ({ id, data: () => data })) });
  let polling = null;
  async function poll() {
    if (polling) return polling;
    polling = (async () => { try { const j = await api("state?collections=" + [...listeners.keys()].join(",")); for (const [n, cbs] of listeners) cbs.forEach((cb) => cb(snap(j.collections[n]))); st.stateAt = Date.now(); } catch (e) {} finally { polling = null; } })();
    return polling;
  }
  setInterval(() => { if (document.visibilityState === "visible") poll(); }, 60000);
  addEventListener("focus", poll);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") poll(); });
  let pollT = null; const soon = () => { clearTimeout(pollT); pollT = setTimeout(poll, 50); };
  const db = { collection: (name) => ({
    onSnapshot(cb) { if (!listeners.has(name)) listeners.set(name, []); listeners.get(name).push(cb); soon(); return () => {}; },
    doc: (id) => ({
      set: async (data) => { await api("state", { collection: name, id, op: "set", data }); soon(); },
      delete: async () => { await api("state", { collection: name, id, op: "delete" }); soon(); },
    }),
  }) };
  const user = { id: async () => meName() || null, name: async () => meName(), profiles: async (ids) => Object.fromEntries(ids.map((i) => [i, { id: i, name: i }])) };
  const mcp = { callTool: async (server, tool, input) => {
    if (server === GD) { const j = await api("sheet"); st.sheetSource = j.source; return { payload: { content: j.content }, cache: { storedAt: j.storedAt } }; }
    if (server === PD) { const j = await api("pipedrive", { tool, input }); return { payload: j.payload, cache: j.storedAt ? { storedAt: j.storedAt } : null }; }
    throw { code: "tool_error", message: "Unknown connector" };
  } };
  const caps = { db, user, mcp, downloads: null };
  return { use: async (n) => caps[n] || null };
}
function whoAmI() {
  if (st.host !== "netlify") return "";
  const me = meName();
  return `<span class="src">You are <select id="me-sel" aria-label="Who are you?"><option value="">choose your name…</option>${SALES_TEAM.map((n) => `<option ${n === me ? "selected" : ""}>${esc(n)}</option>`).join("")}${me && !SALES_TEAM.includes(me) ? `<option selected>${esc(me)}</option>` : ""}<option value="__other">Someone else…</option></select></span>`;
}
function bindWhoAmI() {
  const s = $("#me-sel"); if (!s) return;
  s.onchange = () => {
    let v = s.value;
    if (v === "__other") { v = (window.prompt ? window.prompt("Your name") : "") || ""; }
    try { localStorage.setItem("mup.me", v.trim().slice(0, 60)); } catch (e) {}
    st.userId = meName() || null; renderSources(); toast(st.userId ? `Changes will be saved as ${st.userId}` : "Name cleared");
  };
}

/* ---------- boot capabilities ---------- */
(async () => {
  let cl = window.claude;
  if (!cl || !cl.use) { cl = await netlifyClaude(); if (!cl) { st.mcp = false; render(); return; } }
  cl.use("downloads").then((d) => { st.downloads = d; }).catch(() => {});
  cl.use("db").then(async (db) => {
    st.db = db; renderSources();
    if (!db) return;
    try { const u = await cl.use("user"); st.user = u; st.userId = u ? await u.id() : null; st.myName = u ? ((await u.name()) || "") : ""; } catch (e) {}
    db.collection("templates").onSnapshot((snap) => {
      st.templates = Object.fromEntries(snap.docs.map((d) => [d.id, d.data() || {}]).filter(([id]) => TEMPLATE_DEFAULTS[id]));
      Object.values(st.email).forEach((x) => { x.draft = null; });
      if (st.rows && !document.activeElement?.closest?.(".email-box")) renderList();
    }, () => {});
    db.collection("systems").onSnapshot((snap) => {
      st.overrides = Object.fromEntries(snap.docs.map((d) => [d.id, d.data() || {}]));
      if (st.rows) rebuild();
    }, () => {});
    db.collection("campaign").onSnapshot(async (snap) => {
      st.campaign = new Map(snap.docs.map((d) => [d.id, d.data() || {}]));
      const ids = [...new Set([...st.campaign.values()].map((x) => x.by).filter(Boolean))];
      if (st.user && ids.length) { try { st.profiles = await st.user.profiles(ids); } catch (e) {} }
      renderList(); renderStrip(); renderPresets();
      const v = (location.hash || "").slice(1); if (v === "renewals") renderRenewals(); if (v === "summary") renderSummary();
      const newDeals = [...st.campaign.values()].map((x) => +x.pdDeal).filter((n) => n > 0 && !st.pd.tracked.has(n));
      if (newDeals.length) loadTracked(false);
    }, () => {});
  }).catch(() => {});
  let mcp = null; try { mcp = await cl.use("mcp"); } catch (e) {}
  st.mcp = mcp || false;
  if (!mcp) { render(); return; }
  await loadSheet(false);
  await loadPipedrive(false);
  await loadTracked(false);
  publishSummaryCache();
})();
})();
