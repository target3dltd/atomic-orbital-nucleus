<svg xmlns="http://www.w3.org/2000/svg" viewBox="2.5 2.5 75 75" width="600" height="600" role="img" aria-label="Atomic Orbital logo"><style>.eq{animation:sp 10s linear infinite}@keyframes sp{to{stroke-dashoffset:-80}}.mer{transform-box:fill-box;transform-origin:center;animation:rot 4s ease-in-out infinite alternate}@keyframes rot{from{transform:scaleX(1)}to{transform:scaleX(.08)}}@media(prefers-reduced-motion:reduce){.eq,.mer{animation:none}}</style><g fill="none" stroke-linecap="round" stroke-linejoin="round"><ellipse class="eq" pathLength="200" cx="40" cy="40" rx="33" ry="9" stroke="#FF5B38" stroke-width="2.4" stroke-dasharray="2 6"/><ellipse class="mer" cx="40" cy="40" rx="13" ry="33" stroke="#3A5A6A" stroke-width="1.4"/><path d="M26 62 40 18 54 62" stroke="#E8EEF5" stroke-width="2.4"/><circle cx="40" cy="40" r="4.4" fill="#FF5B38" stroke="none"/><circle cx="40" cy="40" r="33" stroke="#08DADB" stroke-width="2.4"/></g></svg>