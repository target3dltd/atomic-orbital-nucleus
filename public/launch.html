<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Nucleus</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/brand/logos/favicon/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/brand/fonts/SpaceGrotesk-SemiBold-Latin.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="/brand/css/plex.css">
<link rel="stylesheet" href="/brand/css/atomic-orbital.css">
<link rel="stylesheet" href="/nucleus/nucleus.css">
<script>try{var s=localStorage.getItem('theme');document.documentElement.dataset.theme=s||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}</script>
<script src="/nucleus/nucleus.js"></script>
<script src="/nucleus/registry.js"></script>
</head>
<body class="n-shell">
  <div class="n-shellbar">
    <a class="home" href="/" title="Back to the Nucleus"><span id="mk"></span><span class="hide-sm">Nucleus</span></a>
    <div class="title" id="title"></div>
    <label class="n-sr" for="jump">Go to another tool</label>
    <select id="jump" class="hide-sm"></select>
    <a class="n-iconbtn" id="solo" target="_blank" rel="noopener" title="Open on its own in a new tab"><span id="extIcon"></span><span class="hide-sm">Open on its own</span></a>
    <button class="n-iconbtn" id="themeBtn" type="button"></button>
  </div>
  <iframe class="n-frame" id="frame" title="Tool" allow="clipboard-read; clipboard-write; fullscreen; camera; microphone" allowfullscreen hidden></iframe>
  <div class="n-await" id="missing" hidden><div class="ao-card" style="max-width:520px"><h3 id="mH">Not found</h3><p id="mP" style="margin-top:8px"></p><p style="margin-top:16px"><a class="ao-btn ao-btn--secondary" href="/">Back to the Nucleus</a></p></div></div>
<script>
(function () {
  var N = window.Nucleus, R = window.NUCLEUS_REGISTRY, $ = function (id) { return document.getElementById(id); }, esc = N.esc;
  $("mk").innerHTML = N.mark(28); $("extIcon").innerHTML = N.ICONS.ext;
  N.bindThemeButton($("themeBtn"));
  var id = new URLSearchParams(location.search).get("t"), it = N.item(id); if (it && it.status !== "awaiting") N.addRecent(it.id);

  var opts = R.items.filter(function (i) { return i.status === "live"; });
  $("jump").innerHTML = '<option value="">Go to…</option>' + R.orbits.map(function (o) {
    var g = opts.filter(function (i) { return i.orbit === o.id; });
    return g.length ? '<optgroup label="' + esc(o.name) + '">' + g.map(function (i) { return '<option value="' + esc(i.id) + '"' + (i.id === id ? " selected" : "") + ">" + esc(i.name) + "</option>"; }).join("") + "</optgroup>" : "";
  }).join("");
  $("jump").onchange = function () { if (this.value) location.href = "/launch.html?t=" + encodeURIComponent(this.value); };

  if (!it || it.status === "external") {
    $("title").textContent = "Not found"; $("missing").hidden = false; $("solo").hidden = true;
    $("mP").textContent = "There's no tool called “" + (id || "") + "” in the Nucleus.";
    return;
  }
  document.title = it.name + " · Nucleus";
  $("title").innerHTML = esc(it.name) + "<small>" + esc((R.orbits.filter(function (o) { return o.id === it.orbit; })[0] || {}).name || "") + "</small>";
  $("solo").href = it.href;
  if (it.status !== "live") {
    $("solo").hidden = true; $("mH").textContent = it.name; $("missing").hidden = false;
    $("mP").textContent = "This slot is reserved, but the tool's code hasn't been added to the Nucleus yet.";
    return;
  }
  var f = $("frame"); f.hidden = false; f.title = it.name; f.src = it.href;

  // A tool can tell the shell its session has ended
  window.addEventListener("message", function (e) {
    if (e.origin === location.origin && e.data && e.data.nucleus === "signed-out") location.href = "/?next=" + encodeURIComponent(location.pathname + location.search);
  });
})();
</script>
</body>
</html>
