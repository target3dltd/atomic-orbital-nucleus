<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Lion Repository</title>
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#F2F2F2; --ink:#000000; --muted:#666666; --line:rgba(0,0,0,.12);
  --blue:#33BCF2; --on-blue:#000000; --red:#EF233C; --yellow:#99FF00;
  --green:#000000; --green-ink:#FFFFFF; --brass:#000000; --brass-soft:rgba(51,188,242,.14); --oak:#33BCF2;
  --warn:#EF233C; --warn-soft:rgba(239,35,60,.08); --ok-soft:rgba(51,188,242,.16);
  --chrome:#000000; --chrome-ink:#FFFFFF; --chrome-line:rgba(255,255,255,.16);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#0B0B0B; --sunk:#161616; --ink:#F5F5F5; --muted:#999999; --line:rgba(255,255,255,.16);
    --green:#F5F5F5; --green-ink:#000000; --brass:#F5F5F5; --brass-soft:rgba(51,188,242,.18); --oak:#33BCF2;
    --warn:#EF233C; --warn-soft:rgba(239,35,60,.14); --ok-soft:rgba(51,188,242,.2);
    --chrome:#000000; --chrome-ink:#F5F5F5; --chrome-line:rgba(255,255,255,.16); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#0B0B0B; --sunk:#161616; --ink:#F5F5F5; --muted:#999999; --line:rgba(255,255,255,.16);
    --green:#F5F5F5; --green-ink:#000000; --brass:#F5F5F5; --brass-soft:rgba(51,188,242,.18); --oak:#33BCF2;
    --warn:#EF233C; --warn-soft:rgba(239,35,60,.14); --ok-soft:rgba(51,188,242,.2);
    --chrome:#000000; --chrome-ink:#F5F5F5; --chrome-line:rgba(255,255,255,.16); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Lato",-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
a{color:var(--green)}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
h1,h2,h3,.cond{font-family:"Bebas Neue","Oswald",Impact,sans-serif;letter-spacing:.01em}

:root{--navw:250px;--docw:clamp(330px,25vw,410px);--topbar:0px}
.shell{display:grid;grid-template-columns:var(--navw) minmax(0,1fr);min-height:100vh;min-height:100dvh}
.side{background:var(--green);color:var(--green-ink);padding:24px 16px;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;overscroll-behavior:contain}
.side .brand{font-family:"Bebas Neue","Oswald",Impact,sans-serif;font-weight:700;font-size:2rem;line-height:1;margin:0 0 2px}
.side a.brand{display:inline-block;padding:2px 6px;margin-left:-6px;color:var(--green-ink);text-decoration:none;border-radius:0}
.side a.brand:hover{background:rgba(255,255,255,.1)}
.side .tag{opacity:.75;font-size:.85rem;margin-bottom:22px}
.side nav{display:flex;flex-direction:column;gap:2px}
.side .grp{font-family:"Bebas Neue","Oswald",Impact,sans-serif;font-size:.95rem;opacity:.65;margin:16px 8px 4px}
.side a{color:inherit;text-decoration:none;padding:7px 10px;border-radius:0;display:flex;justify-content:space-between;gap:8px;font-weight:600}
.side a small{opacity:.7;font-weight:400}
.side a:hover{background:rgba(255,255,255,.1)}
.side a[aria-current="page"]{background:var(--green-ink);color:var(--green)}
.side .ver{margin-top:24px;font-size:.8rem;opacity:.7}
main{padding:32px clamp(16px,4vw,48px) 96px;width:100%;max-width:1180px;min-width:0;container:main/inline-size}
@media (min-width:1800px){main{max-width:1320px}}

/* docs panel */
.docs{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:30}
.docs header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.docs .dk{font:700 1.5rem/1 "Bebas Neue","Oswald",Impact,sans-serif;color:var(--green);margin:0}
.docs .dsub{margin:4px 0 0;font-size:.85rem;color:var(--muted)}
.ib{all:unset;cursor:pointer;min-width:40px;height:40px;border-radius:0;display:grid;place-items:center;font-size:1.4rem;line-height:1;color:var(--ink);background:var(--sunk)}
.ib:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.dsearch{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dsearch input{flex:1;min-width:0;font:600 1rem "Lato",-apple-system,"Segoe UI",sans-serif;padding:10px 12px;border:2px solid var(--green);border-radius:0;background:var(--bg);color:var(--ink)}
.dsearch select{font:600 .9rem "Lato",-apple-system,"Segoe UI",sans-serif;padding:8px;border:1.5px solid var(--line);border-radius:0;background:var(--bg);color:var(--ink)}
.dbody{flex:1;overflow:auto;overscroll-behavior:contain;padding:6px 16px 16px;-webkit-overflow-scrolling:touch}
.dbody h3{font-size:1.05rem;color:var(--muted);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.dl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.dl li{display:flex;gap:6px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:0;padding:8px 8px 8px 12px}
.dl li a{flex:1;min-width:0;text-decoration:none;color:inherit}
.dl li a b{display:block;color:var(--green);font-weight:600;line-height:1.25}
.dl li a span{display:block;font-size:.82rem;color:var(--muted);line-height:1.35}
.dl li a i{font-style:normal;font-size:.72rem;color:var(--brass);text-transform:uppercase;letter-spacing:.04em}
.dl li a:hover b{text-decoration:underline}
.pin{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:0;color:var(--muted);font-size:1.05rem;flex:none}
.pin[aria-pressed="true"]{color:var(--brass)}
.pin:focus-visible{outline:3px solid var(--brass)}
.tip{border-left:3px solid var(--brass);background:var(--brass-soft);border-radius:0;padding:8px 10px;margin:0 0 6px;font-size:.88rem}
.tip b{display:block}
.tip a{font-size:.82rem}
details.dsec{border-bottom:1px solid var(--line)}
details.dsec summary{cursor:pointer;padding:9px 0;font-weight:600;display:flex;justify-content:space-between}
details.dsec summary small{color:var(--muted);font-weight:400}
details.dsec .dl{margin-bottom:10px}
.docs footer{border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;font:inherit;padding:9px 10px;border:1.5px solid var(--line);border-radius:0;background:var(--bg);color:var(--ink)}
.docs footer .muted{font-size:.8rem;margin:0}
.fab{all:unset;cursor:pointer;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--green);color:var(--green-ink);font:700 1.05rem "Bebas Neue","Oswald",Impact,sans-serif;padding:12px 18px;border-radius:0;box-shadow:0 6px 20px rgba(0,0,0,.22);z-index:25;display:flex;gap:8px;align-items:center}
.fab:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
.scrim{position:fixed;inset:0;background:rgba(10,18,16,.45);z-index:28;opacity:0;pointer-events:none;transition:opacity .2s}
body.drawer .scrim{opacity:1;pointer-events:auto}
.topbar{display:none}

/* wide: docs inline as third column */
@media (min-width:1280px){
  body.docs-open .shell{grid-template-columns:var(--navw) minmax(0,1fr) var(--docw)}
  .docs{position:sticky;top:0;height:100vh;height:100dvh}
  body:not(.docs-open) .docs{display:none}
  body.docs-open .fab{display:none}
}
/* medium + small: docs as drawer */
@media (max-width:1279.98px){
  .docs{position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);transform:translateX(105%);transition:transform .25s ease;box-shadow:-10px 0 30px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px)}
  body.docs-open .docs{transform:none}
  body.docs-open .fab{display:none}
}
@media (max-width:1100px){:root{--navw:215px}}
/* small: topbar + nav drawer */
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:min(300px,86vw);z-index:30;transform:translateX(-105%);transition:transform .25s ease;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  body.nav-open .side{transform:none}
  .topbar{display:flex;align-items:center;gap:8px;background:var(--green);color:var(--green-ink);padding:8px max(12px,env(safe-area-inset-left,0px));position:sticky;top:0;z-index:20}
  .topbar .ib{background:rgba(255,255,255,.12);color:var(--green-ink)}
  .topbar .tt{flex:1;min-width:0;font:700 1.3rem/1.1 "Bebas Neue","Oswald",Impact,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .tt small{display:block;font:400 .78rem "Lato",-apple-system,"Segoe UI",sans-serif;opacity:.75}
  .topbar .db{all:unset;cursor:pointer;background:var(--green-ink);color:var(--green);font:700 1rem "Bebas Neue","Oswald",Impact,sans-serif;padding:9px 12px;border-radius:0}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--green)}
  .fab{display:none}
  main{padding-top:20px}
}
/* phones: docs as bottom sheet */
@media (max-width:600px){
  .docs{top:auto;left:0;width:100%;height:min(88dvh,88vh);border-left:0;border-top:1px solid var(--line);border-radius:0;transform:translateY(105%)}
  .docs::before{content:"";width:44px;height:5px;border-radius:0;background:var(--line);margin:8px auto 0;flex:none}
  .docs header{padding-top:8px}
}
@media (pointer:coarse){.side a{padding:11px 12px}.btn{padding:12px 18px}.dl li{padding:10px 8px 10px 12px}.pin{width:40px;height:40px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* content adapts to its own width, not the window (panel open or closed) */
@container main (max-width:820px){
  .big{gap:18px}.big b{font-size:2rem}
  ul.doclist{columns:1}
}
@container main (max-width:640px){
  .tbl{background:transparent;border:0;overflow:visible}
  .tbl table{min-width:0}
  .tbl thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .tbl tbody,.tbl tr,.tbl td{display:block}
  .tbl tr{background:var(--surface);border:1px solid var(--line);border-radius:0;margin:0 0 10px;padding:6px 0}
  .tbl tr.sub{margin-top:-12px;border-top:1px dashed var(--line);border-radius:0}
  .tbl td{position:relative;border:0;padding:5px 12px 5px calc(34% + 20px);overflow-wrap:anywhere;min-height:30px}
  .tbl td::before{content:attr(data-label);position:absolute;left:12px;top:7px;width:34%;font:600 .78rem/1.25 "Lato",-apple-system,"Segoe UI",sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .tbl td.nolab{padding-left:12px}
  .tbl td.nolab{display:block}.tbl td.nolab::before{display:none}
  .tbl td:empty{display:none}
  .tbl td.q{width:auto}
  dl.kv{grid-template-columns:1fr}dl.kv dt{border-bottom:0}
  figcaption{flex-direction:column;gap:4px}
  .meta{gap:4px 16px}
  .cards{grid-template-columns:1fr 1fr}
  .search{font-size:1.05rem}
}
@container main (max-width:400px){
  .cards{grid-template-columns:1fr}
  .tbl td{padding-left:12px}.tbl td::before{position:static;display:block;width:auto;margin-bottom:1px}
  .calc{grid-template-columns:1fr}
}
h1.page{font-size:clamp(2.2rem,5vw,3.4rem);line-height:1;margin:0;color:var(--green);font-weight:700}
.kicker{color:var(--muted);margin:4px 0 0}
.lede{max-width:70ch;margin:14px 0 22px}
.meta{display:flex;flex-wrap:wrap;gap:6px 26px;color:var(--muted);font-size:.95rem;margin:12px 0 0}
.meta b{color:var(--ink);font-weight:600}
section{margin:30px 0}
section > h2{font-size:1.6rem;margin:0 0 10px;padding-bottom:4px;border-bottom:1.5px solid var(--line)}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:0}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:8px 10px;vertical-align:top;border-bottom:1px solid var(--line);font-size:.95rem}
tr:last-child td{border-bottom:0}
th{font-weight:600;font-size:.82rem;color:var(--muted);background:var(--sunk)}
td.mono,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.86rem}
.muted{color:var(--muted)}
.chip{display:inline-block;font-size:.8rem;font-weight:600;padding:1px 8px;border-radius:0;background:var(--sunk);white-space:nowrap}
.chip.flex{background:var(--ok-soft);color:var(--green)}
.chip.trio{background:var(--brass-soft);color:var(--brass)}
.chip.arcade,.chip.arcade5{background:var(--green);color:var(--green-ink)}
.chip.popup{background:var(--warn-soft);color:var(--warn)}
.flag{color:var(--warn);font-size:.86rem;margin-top:3px}
details.cams summary{cursor:pointer;color:var(--green);font-weight:600}
details.cams .list{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:0;padding:14px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:6px}
a.card:hover{border-color:var(--green)}
.card .num{font-family:"Bebas Neue","Oswald",Impact,sans-serif;color:var(--muted);font-size:1rem}
.card .nm{font-family:"Bebas Neue","Oswald",Impact,sans-serif;font-size:1.6rem;font-weight:700;line-height:1;color:var(--green)}
.card .mix{display:flex;flex-wrap:wrap;gap:4px}
.card .sm{font-size:.88rem;color:var(--muted)}
.big{display:flex;gap:30px;flex-wrap:wrap;margin:6px 0 4px}
.big div{font-size:.9rem;color:var(--muted)}
.big b{display:block;font:700 2.4rem/1 "Bebas Neue","Oswald",Impact,sans-serif;color:var(--ink)}
dl.kv{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:0;margin:0}
dl.kv dt,dl.kv dd{padding:8px 12px;border-bottom:1px solid var(--line);margin:0}
dl.kv dt{font-weight:600;background:var(--sunk)}
dl.kv dt:last-of-type,dl.kv dd:last-of-type{border-bottom:0}
figure{margin:0 0 18px;background:var(--surface);border:1px solid var(--line);border-radius:0;overflow:hidden}
figure .zoom{display:block;overflow:auto;max-height:70vh;background:#fff;cursor:zoom-in}
figure .zoom.on{cursor:zoom-out}
figure img{display:block;width:100%;height:auto}
figure .zoom.on img{width:auto;max-width:none}
figcaption{padding:8px 12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.92rem}
ul.doclist{list-style:none;padding:0;margin:0;columns:2 280px;column-gap:24px}
ul.doclist li{padding:4px 0;break-inside:avoid}
ol.time{list-style:none;padding:0;margin:0;border-left:2px solid var(--line)}
ol.time li{padding:4px 0 10px 16px;position:relative}
ol.time li::before{content:"";position:absolute;left:-6px;top:11px;width:10px;height:10px;border-radius:0;background:var(--green)}
ol.time b{font-family:"Bebas Neue","Oswald",Impact,sans-serif;font-size:1.05rem;display:inline-block;min-width:110px}
.note{background:var(--sunk);border-radius:0;padding:10px 14px;font-size:.93rem;max-width:80ch}

/* kit lists */
.pegpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:22px}
.pegpick a{background:var(--surface);border:1.5px solid var(--line);border-radius:0;padding:12px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:4px}
.pegpick a[aria-current="page"]{border-color:var(--green);box-shadow:inset 0 0 0 1.5px var(--green)}
.pegpick svg{width:100%;height:auto}
.pegpick .n{font-family:"Bebas Neue","Oswald",Impact,sans-serif;font-weight:700;font-size:1.2rem}
.pegpick .m{font-size:.85rem;color:var(--muted)}
td.q{font-family:"Bebas Neue","Oswald",Impact,sans-serif;font-size:1.4rem;font-weight:700;width:64px;color:var(--green);line-height:1.1}
td.q small{display:block;font-family:"Lato",-apple-system,"Segoe UI",sans-serif;font-size:.72rem;font-weight:400;color:var(--muted)}
.item{font-weight:600}.model{color:var(--muted);font-size:.9rem}.inote{font-size:.86rem;color:var(--muted);margin-top:3px;max-width:60ch}
.ev{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;padding:2px 8px;border-radius:0;white-space:nowrap;font-weight:600}
.ev::before{content:"";width:8px;height:8px;display:inline-block}
.ev.c{background:var(--ok-soft);color:var(--green)}.ev.c::before{background:var(--green);border-radius:0}
.ev.s{background:var(--brass-soft);color:var(--brass)}.ev.s::before{border:2px solid var(--brass);border-radius:0;width:9px;height:9px}
.ev.i{background:var(--warn-soft);color:var(--warn)}.ev.i::before{background:var(--warn);transform:rotate(45deg);width:7px;height:7px}
.src{font-size:.8rem;color:var(--muted);margin-top:3px}

/* order + serials */
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:14px}
.calc label{background:var(--surface);border:1.5px solid var(--line);border-radius:0;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.calc .lbl{font-family:"Bebas Neue","Oswald",Impact,sans-serif;font-weight:600;font-size:1.15rem}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{all:unset;cursor:pointer;width:36px;height:36px;border-radius:0;background:var(--sunk);display:grid;place-items:center;font-size:1.3rem;font-weight:700;color:var(--ink)}
.stepper button:focus-visible{outline:3px solid var(--brass)}
.stepper input{width:60px;height:36px;text-align:center;font:700 1.3rem "Bebas Neue","Oswald",Impact,sans-serif;border:1.5px solid var(--line);border-radius:0;background:var(--bg);color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin-bottom:14px}
.opts label{display:flex;gap:8px;align-items:center}
.opts input[type=number]{width:70px;padding:6px;border:1.5px solid var(--line);border-radius:0;background:var(--surface);color:var(--ink);font:inherit}
.btn{all:unset;cursor:pointer;padding:9px 16px;border-radius:0;background:var(--green);color:var(--green-ink);font-weight:600}
.btn.ghost{background:transparent;color:var(--green);box-shadow:inset 0 0 0 1.5px var(--green)}
.btn:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 12px}
textarea.csv{width:100%;min-height:150px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--sunk);color:var(--ink);border:1px solid var(--line);border-radius:0;padding:10px}
.search{width:100%;max-width:520px;font:600 1.2rem "Lato",-apple-system,"Segoe UI",sans-serif;padding:12px 14px;border:2px solid var(--green);border-radius:0;background:var(--surface);color:var(--ink)}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:0;padding:20px;color:var(--muted)}
mark{background:var(--brass-soft);color:var(--ink);padding:0 2px;border-radius:0}
.gap{background:var(--surface);border-left:4px solid var(--warn);border-radius:0;padding:12px 16px;margin:0 0 12px;max-width:80ch}
.gap h3{margin:0 0 4px;font-size:1.2rem}.gap p{margin:4px 0}.gap .ask{font-size:.92rem;color:var(--muted)}
.prose{max-width:72ch}.prose h3{font-size:1.3rem;margin:24px 0 6px}
.legend{display:flex;flex-direction:column;gap:8px}
[hidden]{display:none!important}
@media print{.side,.topbar,.docs,.fab,.scrim,.actions,.opts{display:none!important}.shell{display:block}body{background:#fff}main{max-width:none}}

/* ---------- Target3D design system ---------- */
body{font-weight:300;line-height:1.6}
b,strong,th,.item{font-weight:700}
h1,h2,h3,.cond{font-weight:400;text-transform:uppercase;letter-spacing:.02em}
h1.page{color:var(--ink);font-weight:400;line-height:.95;font-size:clamp(2.6rem,6vw,4rem)}
section > h2{font-size:clamp(1.6rem,3vw,2rem);border-bottom:1px solid var(--line);color:var(--ink)}
.kicker{text-transform:uppercase;letter-spacing:.08em;font-size:.8rem;font-weight:700;color:var(--muted)}

 {id:"cal-vs-live",t:"Switch between calibration and live settings",ap:["karts","pacman","alien"],
  lede:"Gain, exposure and frame rate are changed by hand between calibrating and running the game. The 7 Sep report asked for this to be written down; this is the procedure as recorded so far.",
  steps:["Charge the wand and ground plane fully first. Neither has a battery indicator, and low charge gives poor results without an obvious cause.","Mask stray reflections, including sunlight coming through the roof.","Set calibration settings for the arena (table below). Drop gain to about 1: high gain interferes with calibration.","ChaosKarts: drive the wand round the volume at 360 fps and gain 1. Lower fps or higher gain gave poor results.","Wand until every camera’s indicator turns light green, then check the result is Exceptional or Excellent.","Set the ground plane.","Put the live settings back (table below) and run a test game before bookings."],

  notes:[["flag","Suggested in reports: a dedicated wand and ground plane per arena, wall hooks to store them, and a charging routine."]],src:["R07","R21","WIKI"]},

  notes:[["flag","8 vests were done on 21 Sep but nobody recorded which, so all are treated as outstanding."]],src:["R21","WIKI"]},
 {id:"activeio",t:"Set up ActiveIO kit",ap:["alien","karts","pacman","rnd"],
  lede:"Summarised from OptiTrack’s documentation in the wiki.",
  steps:["Each system needs at least one BaseStation. It links tags and pucks to Motive on an RF channel (11–26) and syncs the LEDs to camera exposure. Plan for about 100 ft of range.","Tags and pucks are identified by their LED pattern, so Motive labels them without a distinctive marker geometry.","Puck: hold the button about 1 s to power on. Holding longer than 3 s enters bootloader mode (both LEDs orange); power-cycle to exit.","Devices pair automatically out of the box. Change channels or labels only with the Active Batch Programmer, not in Motive.","Raise Pattern Depth (default 12) as asset count grows, or IDs can duplicate."],
  notes:[["note","Each arena runs its own Motive and BaseStation, so the same active IDs can be reused across arenas. Within one arena they must be unique."]],src:["WIKI"]},

 <section><h2>Supplier orders (Target3D → NaturalPoint)</h2>${tbl(["PO","Sales order","Packing slips","Contents","Note"],SUPPLIER.map(r=>tr([`<span class="mono">${esc(r[0])}</span>`,esc(r[1]),esc(r[2]),esc(r[3]),esc(r[4])])))}<p class="src">Source: ${src1("NP")}</p></section>
 <section><h2>Engineering time</h2><p>Day rate from 21 Sep 2026: <b>£850 ex VAT</b> per engineer per day. Quote 10614 (24 Sep) billed only 21 Sep (3 engineers, £2,550) and 28–29 Sep (2 engineers, £3,400): £5,950 ex VAT, with £11,050 of earlier visits waived. Pipedrive marks it <b>lost on 29 Sep, no budget</b>.</p>
 <p class="note">Allan’s note: margin on this account sits in professional services that were stripped out of the hardware sale. Suggested a £10k retainer for work to date plus a fund for future visits, or a formal monthly SLA.</p></section>
 <section><h2>SLA agenda (Allan and Jon)</h2><ul><li>Move from ad hoc visits and spares to a monthly SLA.</li><li>Lens deep clean.</li><li>A spares stock so a failed camera, tag or BaseStation can be hot-swapped.</li><li>Three dedicated sessions: Alien Invasion upgrade day, vest pivot/refine half-day, ChaosKarts deep clean.</li></ul></section>
 <section><h2>Other quotes</h2>${tbl(["Ref","Date","For","Status","Amount"],[tr(["PD-10492 v1","19 Aug 2026","20 bare Active IO Tag PCBs (ACTBCN0001)","Superseded","£6,750 inc VAT"]),tr(["PD-10492 v3","13 Oct 2026","10 bare Active IO Tag PCBs + shipping","PO pending","£2,825 ex VAT"]),tr(["Offer 92494","19 Jun 2026","Schneider Digital: 4U rackmount conversion, fan, case buyback (SD2545FD47061201622)","Non-binding","€495"])])}</section>
 <section><h2>Where Little Lion is heading</h2><p class="note">At the January demo Little Lion said they plan 50 new locations in 5 years, including London, Dubai and Abu Dhabi, moving from BlackTrax. They asked about dual-game sites sharing BaseStations and eSync, and the active LED limit (BlackTrax: 255 LEDs). The 7 Sep report flags a possible further install at another site once OptiTrack is proven here.</p></section>`;
}

/* ---------------- Contacts ---------------- */
function pageContacts(){return `<p class="kicker">Plan</p><h1 class="page">Contacts</h1><p class="lede">Who to ask. Use the support ticket tracker rather than direct messages, so there’s a record.</p>
 ${tbl(["Name","Organisation","Role and notes"],CONTACTS.map(c=>tr([`<b>${esc(c[0])}</b>`,esc(c[1]),esc(c[2])])))}
 <p class="note">Site: The Workshop / Arcade Arena, 26 Lambeth High Street, London SE1 7AG. Office: First Floor, 53 Greek Street, London W1D 3DR.</p>`}

/* ---------------- Gaps ---------------- */
function pageGaps(){return `<p class="kicker">Tools</p><h1 class="page">Gaps to close</h1><p class="lede">Where the records are missing or disagree, and what would settle each one.</p>
 ${GAPS.map(g=>`<div class="gap"><h3>${esc(g[0])}</h3><p>${esc(g[1])}</p><p class="ask">To close: ${esc(g[2])}</p></div>`).join("")}`}

/* ---------------- Help ---------------- */
function pageHelp(){return `<div class="prose"><p class="kicker">Tools</p><h1 class="page">Help</h1>
 <p>This is Target3D’s internal repository for the Little Lion Entertainment installs, built in the same format as the Clays repository. It brings the Little Lion OptiTrack wiki together with the site reports, quotes, NaturalPoint packing slips and Pipedrive.</p>
 <h3>Finding things</h3><p>Use the left menu, or the <b>Serial finder</b> for any camera, licence, key, BaseStation, tag or rigid body. Type an active marker ID (such as 2088) to see every asset using it. Arena pages pull together settings, kit, serials, licence, open items and documents for that arena.</p>
 <h3>OptiTrack docs panel</h3><p>The panel on the right (or the OptiTrack docs button) suggests docs.optitrack.com pages for the page you’re on. Press <b>/</b> to search, star pages to pin them, and choose a Motive version. It remembers your pins in this browser only.</p>
 <h3>Labels</h3><p>A red square marks a flag that needs action. Blue-edged notes are context. Priorities on Open items are High, Medium and Low.</p>
 <h3>What isn’t here</h3><p>Passwords and remote-access details. Licence hashes are hidden until you choose Show. The live ticket tracker and tickable checklist remain on the Netlify wiki (littleliont3d.netlify.app).</p>
 <h3>Keeping it current</h3><p>This page is a snapshot. Send updates (moved cameras, licence exports, pivot/refine dates, closed items) and the next version will include them.</p>
 <h3>Version history</h3><ul><li><b>${VERSION}</b> — ${BUILT}. First release. Arenas, camera, licence, active-hardware and trackable registers, serial finder, how-tos, known issues, visit log, Upgrade Day checklist, open items, commercial, contacts, gaps and OptiTrack docs panel. New since the wiki: packing-slip shipping for each camera and BaseStation, the test-system licence MTRL4322 and second active wand and square, and the source of Pac-Man’s six Slim X 13s.</li></ul></div>`}


/* ---------------- OptiTrack docs panel ---------------- */
const OTB="https://docs.optitrack.com";
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let pins=store.get("ll-pins",[]), dver=store.get("ll-ver","");
const wide=()=>matchMedia("(min-width:1280px)").matches;
function ctx(id){
 const a=AR(id);
 if(a)return{label:a.name+" — Slim X, ActiveIO",tags:["a","c","n"]};
 return({overview:{label:"Overview",tags:["all","a","c"]},cameras:{label:"Cameras",tags:["n","c","all"]},licences:{label:"Licences and keys",tags:["l"]},active:{label:"Active hardware",tags:["a"]},trackables:{label:"Trackables and marker IDs",tags:["a","c"]},serials:{label:"Serial finder",tags:["a","l"]},
  howto:{label:"How-tos",tags:["c","a"]},issues:{label:"Known issues",tags:["all","a","l"]},visits:{label:"Visit log",tags:["all"]},upgrade:{label:"Upgrade Day",tags:["c","a","l"]},tickets:{label:"Open items",tags:["a","c","all"]},commercial:{label:"Commercial",tags:["l","p"]},contacts:{label:"Contacts",tags:["all"]},gaps:{label:"Gaps",tags:["l","all"]},help:{label:"Help",tags:["all"]}})[id]||{label:"",tags:["all"]};
}
const durl=p=>OTB+dver+p;
const docItem=(d,q)=>{const hl=s=>q?esc(s).replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>"):esc(s);const on=pins.includes(d.p);
 return `<li><a href="${durl(d.p)}" target="_blank" rel="noopener"><i>${esc(d.s)}</i><b>${hl(d.t)}</b><span>${hl(d.d)}</span></a><button class="pin" data-p="${esc(d.p)}" aria-pressed="${on}" aria-label="${on?"Unpin":"Pin"} ${esc(d.t)}" title="${on?"Unpin":"Pin"}">${on?"★":"☆"}</button></li>`};
let curId="overview";
function renderDocs(){
 const q=$("#dq").value.trim(), c=ctx(curId), b=$("#dbody");
 $("#dctx").textContent=c.label?("For: "+c.label):"";
 if(q){
  const words=q.toLowerCase().split(/\s+/).filter(Boolean);
  const res=D.DOCS.map(d=>{const T=d.t.toLowerCase(),S=(d.d+" "+d.s).toLowerCase();let sc=0;for(const w of words){if(T.includes(w))sc+=3;else if(S.includes(w))sc+=1;else return null}return{d,sc}}).filter(Boolean).sort((a,b)=>b.sc-a.sc);
  b.innerHTML=res.length?`<h3>${res.length} result${res.length>1?"s":""}</h3><ul class="dl">${res.map(r=>docItem(r.d,words.length===1?words[0]:"")).join("")}</ul>`
   :`<p class="muted" style="margin-top:14px">Nothing in the bundled index. Try the Ask box below, or <a href="${OTB}${dver}/readme" target="_blank" rel="noopener">search on docs.optitrack.com</a>.</p>`;
 } else {
  const pools=c.tags.map(tg=>D.DOCS.filter(d=>d.g.includes(tg))), rec=[];
  for(let i=0;rec.length<8&&i<20;i++)pools.forEach(pl=>{const d=pl.find(x=>!rec.includes(x));if(d&&rec.length<8)rec.push(d)});
  const tips=D.TIPS.filter(tp=>tp.g.some(g=>c.tags.includes(g))).slice(0,3);
  const pinned=D.DOCS.filter(d=>pins.includes(d.p));
  const secs=[...new Set(D.DOCS.map(d=>d.s))];
  b.innerHTML=(pinned.length?`<h3>Pinned</h3><ul class="dl">${pinned.map(d=>docItem(d)).join("")}</ul>`:"")
   +(tips.length?`<h3>Key facts</h3>${tips.map(tp=>`<div class="tip"><b>${esc(tp.t)}</b>${esc(tp.d)} <a href="${durl(tp.p)}" target="_blank" rel="noopener">Source</a></div>`).join("")}`:"")
   +`<h3>For this page</h3><ul class="dl">${rec.map(d=>docItem(d)).join("")}</ul>`
   +`<h3>Browse</h3>${secs.map(s=>{const L=D.DOCS.filter(d=>d.s===s);return `<details class="dsec"><summary>${esc(s)} <small>${L.length}</small></summary><ul class="dl">${L.map(d=>docItem(d)).join("")}</ul></details>`}).join("")}`;
 }
 b.querySelectorAll(".pin").forEach(x=>x.onclick=()=>{const p=x.dataset.p;pins=pins.includes(p)?pins.filter(y=>y!==p):[...pins,p];store.set("ll-pins",pins);renderDocs()});
}
let lastTrigger=null;
function setDocs(open,focus){
 document.body.classList.toggle("docs-open",open);
 ["#dfab","#dtop"].forEach(s=>$(s).setAttribute("aria-expanded",open));
 if(wide())store.set("ll-open",open);
 syncDrawer();
 if(open&&focus)setTimeout(()=>$("#dq").focus(),wide()?0:260);
 if(!open&&lastTrigger&&!wide())lastTrigger.focus();
}
function setNav(open){document.body.classList.toggle("nav-open",open);$("#menu").setAttribute("aria-expanded",open);syncDrawer();if(open)setTimeout(()=>{const a=$("#sidenav a[aria-current]");a&&a.focus()},260)}
function syncDrawer(){const d=(!wide()&&document.body.classList.contains("docs-open"))||document.body.classList.contains("nav-open");document.body.classList.toggle("drawer",d);document.body.style.overflow=d?"hidden":""}
$("#dfab").onclick=e=>{lastTrigger=e.currentTarget;setDocs(true,true)};
$("#dtop").onclick=e=>{lastTrigger=e.currentTarget;setNav(false);setDocs(!document.body.classList.contains("docs-open"),true)};
$("#dclose").onclick=()=>setDocs(false);
$("#menu").onclick=()=>{setDocs(false);setNav(!document.body.classList.contains("nav-open"))};
$("#scrim").onclick=()=>{setNav(false);if(!wide())setDocs(false)};
$("#sidenav").addEventListener("click",e=>{if(e.target.closest("a"))setNav(false)});
$("#dq").addEventListener("input",renderDocs);
$("#dver").value=dver;$("#dver").onchange=e=>{dver=e.target.value;store.set("ll-ver",dver);renderDocs()};
$("#askf").onsubmit=e=>{e.preventDefault();const q=$("#askq").value.trim();if(!q)return;window.open(`${OTB}/readme.md?ask=${encodeURIComponent(q)}&goal=${encodeURIComponent("Support and maintain OptiTrack Slim X and ActiveIO systems at a location-based entertainment venue")}`,"_blank","noopener")};
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){if(document.body.classList.contains("nav-open"))setNav(false);else if(!wide()&&document.body.classList.contains("docs-open"))setDocs(false)}
 if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();lastTrigger=document.activeElement;setDocs(true,true)}
});
matchMedia("(min-width:1280px)").addEventListener("change",()=>{setNav(false);document.body.classList.toggle("docs-open",wide()?store.get("ll-open",true):false);syncDrawer()});
matchMedia("(min-width:861px)").addEventListener("change",()=>setNav(false));
if(wide()&&store.get("ll-open",true))document.body.classList.add("docs-open");

function labelTables(root){root.querySelectorAll(".tbl table").forEach(tb=>{const h=[...tb.querySelectorAll("thead th")].map(th=>th.textContent.trim());
 tb.querySelectorAll("tbody tr").forEach(tr=>{const tds=[...tr.children];let col=0;tds.forEach(td=>{if(td.colSpan>1||!h[col]){td.classList.add("nolab")}else td.dataset.label=h[col];col+=td.colSpan||1})})})}

/* ---------------- Router ---------------- */
function route(){
 let [id,anchor]=(location.hash||"#overview").slice(1).split(":"); if(!PAGES.some(p=>p.id===id)) id="overview";
 renderNav(id); const m=$("#main"); const a=AR(id);
 m.innerHTML= id==="overview"?pageOverview(): a?pageArena(a): id==="cameras"?pageCameras(): id==="licences"?pageLicences(): id==="active"?pageActive(): id==="trackables"?pageTrackables(anchor): id==="serials"?pageSerials(): id==="howto"?pageHowto(): id==="issues"?pageIssues(): id==="visits"?pageVisits(): id==="upgrade"?pageUpgrade(): id==="tickets"?pageTickets(): id==="commercial"?pageCommercial(): id==="contacts"?pageContacts(): id==="gaps"?pageGaps(): pageHelp();
 if(id==="cameras")wireCameras(); if(id==="licences")wireLicences(); if(id==="serials")wireSerials(); if(id==="tickets")wireTickets();
 labelTables(m); curId=id; renderDocs();
 const tgt=anchor&&(document.getElementById((id==="howto"?"how-":"tr-")+anchor));
 if(tgt)tgt.scrollIntoView(); else if(id!==curScroll)window.scrollTo(0,0);
 curScroll=id;
}
let curScroll="";
window.addEventListener("hashchange",route);
$("#ver").textContent=VERSION+" · "+BUILT;
route();

</script>
</body>
</html>
