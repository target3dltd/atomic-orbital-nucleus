# Atomic Orbital Nucleus
[build]
  # The scramble build (build/protect.mjs) minifies pages and stamps the copyright, writing to dist/.
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Edge function netlify/edge-functions/gate.js protects /tools/*, /projects/* and /launch.html (see its config)

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Robots-Tag = "noindex, nofollow"

# Caching (no two rules below match the same file, so values never combine).
# Tools and project sites get their cache headers from the gate (netlify/edge-functions/gate.js).
# Pages: kept by the browser but re-checked every time (a fast 304 when unchanged).
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

# Nucleus scripts and styles: links carry ?v=<content hash> from the build, so a day is safe.
[[headers]]
  for = "/nucleus/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Brand fonts, logos and style sheet rarely change.
[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/help"
  to = "/#help"
  status = 302
