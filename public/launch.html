<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Nucleus</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<script src="/nucleus/registry.js"></script>
<script>
  // Old links (/launch.html?t=<tool>) now go straight to the tool's own page. Since v1.12.0 tools open as their own
  // pages rather than inside a frame, so Claude in Chrome can read and use them; each page has the Nucleus dock.
  (function () {
    var id = new URLSearchParams(location.search).get("t"), R = window.NUCLEUS_REGISTRY || { items: [] };
    var it = R.items.filter(function (i) { return i.id === id && i.status === "live"; })[0];
    location.replace(it ? it.href : "/");
  })();
</script>
</head>
<body><p><a href="/">Back to the Nucleus</a></p></body>
</html>
